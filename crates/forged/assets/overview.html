  function viewWaves(data) {
    const out = [];
    const status = data.status || {};
    const children = arr(status.children);
    const waves = arr(status.waves);
    const byId = new Map(children.map((c) => [c.id, c]));

    const box = panel("Waves", `${children.length} bead${children.length === 1 ? "" : "s"}`);
    const body = box.flush();
    if (!children.length) {
      body.append(el("div", "empty", "The epic inventory is empty."));
    } else {
      const grouped = waves.length
        ? waves.map((w) => ({ wave: w.wave, ids: arr(w.children) }))
        : [{ wave: null, ids: children.map((c) => c.id) }];
      const placed = new Set(grouped.flatMap((g) => g.ids));
      const rest = children.filter((c) => !placed.has(c.id));
      if (rest.length) grouped.push({ wave: null, ids: rest.map((c) => c.id) });

      for (const group of grouped) {
        const wave = el("div", "wave");
        const head = el("div", "wave__head");
        head.append(el("b", "", group.wave != null ? `Wave ${group.wave}` : "Not scheduled"));
        const merged = group.ids.filter((id) => byId.get(id)?.merged).length;
        head.append(el("span", "panel__note", `${merged}/${group.ids.length} merged`));
        wave.append(head);
        const beads = el("div", "beads");
        for (const id of group.ids) {
          const child = byId.get(id);
          if (!child) continue;
          const card = el("div", "bead");
          const top = el("div", "bead__top");
          top.append(el("span", "bead__id", child.id));
          // Beads status outranks "has a run": a blocked bead with a live run
          // is still blocked, and the operator needs to see that first.
          const held = at(status, "inputRequired.childId") === child.id;
          const [label, tone] = child.merged ? ["merged", "pass"]
            : held ? ["needs input", "block"]
            : child.beadsStatus === "blocked" ? ["blocked", "block"]
            : child.runId && child.beadsStatus === "in_progress" ? ["running", "live"]
            : [child.beadsStatus || "unknown", "idle"];
          top.append(chip(label, tone));
          card.append(top);
          card.append(el("div", "bead__title", child.title || ""));
          const foot = el("div", "bead__foot");
          if (child.beadsStatus) foot.append(el("span", "", `bd ${child.beadsStatus}`));
          if (child.runId && child.runId !== child.id) foot.append(el("span", "trunc", child.runId));
          if (child.generation) foot.append(el("span", "", `gen ${child.generation}`));
          if (at(child, "merged.pr")) foot.append(el("span", "", `PR #${at(child, "merged.pr")}`));
          card.append(foot);
          beads.append(card);
        }
        wave.append(beads);
        body.append(wave);
      }
    }
    out.push(box);

    const integration = status.integration;
    const finalPr = status.finalPr;
    if (integration || finalPr) {
      const iBox = panel("Integration", "");
      const cols = el("div", "cols");
      cols.append(kv([
        ["branch", at(integration, "branch")],
        ["base", at(integration, "baseRef")],
        ["cut at", at(integration, "cutSha")],
      ]));
      if (finalPr) {
        const link = el("span", "", finalPr.url || "");
        cols.append(kv([
          ["final PR", `#${finalPr.number}${finalPr.isDraft ? " (draft)" : ""}`],
          ["head", finalPr.head],
          ["url", host.capabilities.openLinks && finalPr.url ? linkButton(finalPr.url) : link],
        ]));
      }
      iBox.body.append(cols);
      out.push(iBox);
    }

    // Child runs roll up their own evidence; surface the counts that matter.
    const childRuns = arr(data.childRuns);
    if (childRuns.length) {
      const cBox = panel("Child runs", `${childRuns.length}`);
      const cBody = cBox.flush();
      const table = el("table", "tbl");
      const thead = el("thead"); const hr = el("tr");
      for (const label of ["run", "state", "packets", "findings", "gates"]) hr.append(el("th", "", label));
      thead.append(hr); table.append(thead);
      const tbody = el("tbody");
      for (const child of childRuns) {
        const tr = el("tr");
        tr.append(el("td", "", child.id));
        const cell = el("td");
        if (child.error) cell.append(chip(child.error.code || "error", "block"));
        else { const h = headline(child); cell.append(chip(h.label, h.tone)); }
        tr.append(cell);
        tr.append(el("td", "num", arr(at(child, "status.packets")).length || "—"));
        tr.append(el("td", "num", arr(at(child, "reviews.latestFindings")).length || "—"));
        tr.append(el("td", "num", arr(child.gates).length || "—"));
        tbody.append(tr);
      }
      table.append(tbody);
      cBody.append(table);
      out.push(cBox);
    }
    return out;
  }

  function linkButton(url) {
    const button = el("button", "pill", url.replace(/^https?:\/\//, ""));
    button.addEventListener("click", () => { request("ui/open-link", { url }).catch(() => {}); });
    return button;
  }

  function eventSummary(event) {
    const p = event.payload || {};
    switch (event.kind) {
      case "attempt.state": return `attempt ${p.attemptId} ${p.old || "∅"} → ${p.new}${p.reason ? ` (${p.reason})` : ""} · ${p.packetId || ""}`;
      case "forged.session.started": return `${p.host} session ${p.sessionId} for attempt ${p.attemptId}`;
      case "forged.host.fallback":
      case "forged.controller.host.fallback": return `${p.requested} → ${p.selected}: ${p.reason || ""}`;
      case "proto.gate": return `${p.phase} round ${p.seq} ${p.passed ? "passed" : "FAILED"} · ${arr(p.rows).length} commands`;
      case "proto.pr": return `${p.isDraft ? "draft " : ""}PR #${p.number} ${p.url || ""}`;
      case "proto.retry": return `${p.packetId} retry ${p.transportFailures} after ${p.retryAfter}`;
      case "proto.review": return `${p.stage} seq ${p.seq} ${p.verdict || (p.available === false ? "unavailable" : "")}`;
      case "proto.quarantine": return `attempt ${p.attemptId} refused: ${p.reason || ""}`;
      case "proto.operation.request": return `${p.name} ${p.effectClass} · ${p.idempotencyKey || ""}`;
      case "forged.profile.escalated": return `${p.from} → ${p.to} on ${p.trigger}`;
      case "forged.controller.started": return `${p.host} controller ${p.sessionId} gen ${p.generation}`;
      case "forged.run.spec": return p.specPath || "";
      default: {
        const text = JSON.stringify(p);
        return text === "{}" ? "" : text.slice(1, 200);
      }
    }
  }

  // Money is never invented here. A cost the provider billed and a cost
  // imputed from the operator's rate card render differently, and a row
  // with neither reads as unknown rather than as zero.
  function viewCost(data, rows) {
    const out = [];
    const usage = data.usage || {};
    const totals = usage.totals || {};
    const usageRows = arr(usage.rows);
    const seatFor = new Map(arr(rows).map((r) => [r.packetId, r]));

    const money = (v) => (typeof v === "number" && Number.isFinite(v)
      ? (v >= 0.01 ? "$" + v.toFixed(2) : "$" + v.toFixed(4)) : null);
    const toks = (v) => {
      const n = num(v);
      if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + "K";
      return String(n);
    };

    const prompt = num(totals.inputTokens) + num(totals.cacheReadTokens) + num(totals.cacheWriteTokens);
    const cacheRead = num(totals.cacheReadTokens);
    const missing = num(totals.rowsMissingCost);
    const known = num(totals.costUsdKnown);
    const imputed = usageRows
      .filter((r) => r.pricingBasis === "imputed_api_rate")
      .reduce((sum, r) => sum + num(r.costUsd), 0);

    const head = panel("Spend", missing ? missing + " unpriced" : "fully priced");
    const stats = el("div", "spend");
    const stat = (value, key, sub, soft) => {
      const cell = el("div");
      cell.append(el("div", "spend__n" + (soft ? " spend__n--soft" : ""), value));
      cell.append(el("div", "spend__k", key));
      if (sub) cell.append(el("div", "spend__sub", sub));
      return cell;
    };
    stats.append(stat(money(known) || "—", "cost", imputed > 0
      ? money(known - imputed) + " billed · " + money(imputed) + " imputed"
      : "provider-billed"));
    stats.append(stat(toks(prompt), "prompt tokens", prompt
      ? Math.round((cacheRead / prompt) * 100) + "% served from cache" : null));
    stats.append(stat(toks(totals.outputTokens), "output tokens"));
    const searches = usageRows.reduce((n, r) => n + num(r.webSearchRequests), 0);
    if (searches) {
      const rate = usage.pricing && usage.pricing.webSearchPer1k;
      stats.append(stat(String(searches), "web searches",
        rate ? "$" + (rate / 1000).toFixed(3) + " per call" : null));
    }
    stats.append(stat(String(usageRows.length || "—"), "priced attempts",
      missing ? missing + " without a rate" : null, !usageRows.length));
    head.body.append(stats);
    if (usage.pricing) {
      head.append(el("div", "provenance",
        "imputed rates as of " + usage.pricing.ratesAsOf + " — " + usage.pricing.source));
    }
    out.push(head);

    if (!usageRows.length) {
      const box = panel("By seat", "");
      box.flush().append(el("div", "empty", data.kind === "epic"
        ? "No usage recorded on any child run."
        : "No usage recorded. `forged usage ingest --run " + (data.id || "<run>")
          + "` backfills a run that settled before capture."));
      out.push(box);
      return out;
    }

    // Two rows for one packet mean an attempt was superseded: its tokens
    // are the run's rework cost, not a duplicate of the attempt that
    // replaced it.
    const perPacket = new Map();
    for (const row of usageRows) {
      if (!perPacket.has(row.packetId)) perPacket.set(row.packetId, []);
      perPacket.get(row.packetId).push(row);
    }
    const superseded = new Set();
    for (const [, group] of perPacket) {
      if (group.length < 2) continue;
      const landed = Math.max.apply(null, group.map((r) => num(r.attemptId)));
      for (const row of group) if (num(row.attemptId) !== landed) superseded.add(row);
    }

    const peak = Math.max.apply(null, usageRows.map((r) => num(r.costUsd)).concat([0]));
    const box = panel("By seat", usageRows.length + (usageRows.length === 1 ? " attempt" : " attempts"));
    const body = box.flush();
    const table = el("table", "tbl");
    const thead = el("thead");
    const hr = el("tr");
    const cols = [["seat", ""], ["model", ""], ["uncached", "num"],
                  ["cache read", "num"], ["output", "num"], ["cost", "num"]];
    for (const [label, cls] of cols) hr.append(el("th", cls, label));
    thead.append(hr);
    table.append(thead);
    const tbody = el("tbody");
    for (const row of usageRows) {
      // An epic's rows come from its children, so `seatFor` — built from
      // this run's own packets — never holds them. The packet id names the
      // seat either way; the run stamped on the row says whose it was.
      const seat = seatFor.get(row.packetId) || (row.packetId ? seatOf(row.packetId) : null);
      const tr = el("tr");
      const who = el("td");
      who.append(el("div", "", seat ? seat.seat + " · R" + seat.round : "—"));
      if (row.runId && row.runId !== data.id) {
        who.append(el("div", "basis", row.runId));
      }
      if (superseded.has(row)) {
        who.append(el("div", "basis basis--imputed", "superseded · rework"));
      }
      if (num(row.webSearchRequests)) {
        const n = num(row.webSearchRequests);
        who.append(el("div", "basis", n + (n === 1 ? " web search" : " web searches")));
      }
      tr.append(who);
      const model = el("td");
      model.append(el("div", "", row.model || "—"));
      model.append(el("div", "basis", row.provider || ""));
      tr.append(model);
      tr.append(el("td", "num", toks(row.inputTokens)));
      tr.append(el("td", "num", toks(row.cacheReadTokens)));
      tr.append(el("td", "num", toks(row.outputTokens)));
      const cost = el("td", "num");
      const value = money(row.costUsd);
      cost.append(el("div", "", value || "unknown"));
      cost.append(el("div", "basis" + (row.pricingBasis === "imputed_api_rate" ? " basis--imputed" : ""),
        row.pricingBasis === "imputed_api_rate" ? "imputed"
          : row.pricingBasis === "billed" ? "billed" : "no rate"));
      if (value && peak > 0) {
        const fill = el("div", "cost__bar");
        fill.style.width = Math.max(2, (num(row.costUsd) / peak) * 100) + "%";
        cost.append(fill);
      }
      tr.append(cost);
      tbody.append(tr);
    }
    table.append(tbody);
    body.append(table);
    out.push(box);
    return out;
  }

  function viewLedger(data) {
    const events = arr(at(data, "events.events"));
    const kinds = [...new Set(events.map((e) => e.kind))].sort();
    const box = panel("Ledger", `${events.length} of ${data.cursor ?? events.length} events`);
    const body = box.flush();

    const filters = el("div", "filters");
    for (const kind of kinds) {
      const on = state.eventKinds.size === 0 || state.eventKinds.has(kind);
      const button = el("button", "pill", `${kind.replace(/^(proto|forged)\./, "")} ${events.filter((e) => e.kind === kind).length}`);
      button.setAttribute("aria-pressed", String(state.eventKinds.size > 0 && on));
      button.title = kind;
      button.addEventListener("click", () => {
        if (state.eventKinds.has(kind)) state.eventKinds.delete(kind); else state.eventKinds.add(kind);
        render();
      });
      filters.append(button);
    }
    const search = el("input");
    search.type = "search";
    search.placeholder = "filter payloads";
    search.value = state.eventQuery;
    search.addEventListener("input", () => {
      state.eventQuery = search.value;
      renderLedgerRows(list, data);
    });
    filters.append(search);
    body.append(filters);

    const list = el("div", "scroll");
    body.append(list);
    renderLedgerRows(list, data);
    return [box];
  }

  function renderLedgerRows(list, data) {
    list.textContent = "";
    const query = state.eventQuery.trim().toLowerCase();
    const events = arr(at(data, "events.events")).filter((event) => {
      if (state.eventKinds.size && !state.eventKinds.has(event.kind)) return false;
      if (!query) return true;
      return JSON.stringify(event).toLowerCase().includes(query);
    }).reverse();

    if (!events.length) {
      list.append(el("div", "empty", "No events match this filter."));
      return;
    }
    for (const event of events) {
      const wrap = el("div", "ev");
      const head = el("button", "ev__head");
      head.setAttribute("aria-expanded", String(state.openEvents.has(event.eventId)));
      head.append(el("span", "ev__id", event.eventId));
      head.append(el("span", "ev__ts", clock(event.ts)));
      const family = event.kind.startsWith("proto.") ? "proto" : event.kind.startsWith("attempt.") ? "attempt" : "forged";
      head.append(el("span", `ev__kind--${family}`, event.kind));
      head.append(el("span", "ev__sum", eventSummary(event)));
      head.addEventListener("click", () => {
        if (state.openEvents.has(event.eventId)) state.openEvents.delete(event.eventId);
        else state.openEvents.add(event.eventId);
        renderLedgerRows(list, data);
      });
      wrap.append(head);
      if (state.openEvents.has(event.eventId)) {
        const detail = el("div", "ev__body");
        detail.append(el("pre", "", JSON.stringify(event.payload, null, 2)));
        wrap.append(detail);
      }
      list.append(wrap);
    }
  }

  // ------------------------------------------------------------- resolution
  /**
   * The chooser an unresolvable `id` answers with: the inventory entries
   * that could have been meant, each carrying the explicit param it would
   * be re-asked with. A wrong guess is a menu, not a dead end.
   */
  function viewResolution(resolution) {
    const candidates = arr(resolution.candidates);
    const box = panel("Which one", resolution.reason === "ambiguous"
      ? `${candidates.length} ids start with this one`
      : "no run or epic goes by this id");
    const body = box.flush();
    if (!candidates.length) {
      body.append(el("div", "empty", "Nothing in the ledger matches. Ask work_list for the whole inventory."));
      return [box];
    }
    body.append(pickGrid(candidates));
    if (!host.capabilities.serverTools) {
      body.append(el(
        "div",
        "empty",
        "This host does not proxy tool calls, so these cannot be opened from here. Ask overview for one by id.",
      ));
    }
    return [box];
  }

  /**
   * One grid of inventory entries, each a click into that subject.
   *
   * A chooser's candidates and the portfolio's entries are the same rows of
   * the same inventory, so they draw the same card; a key a row does not
   * carry — spend, on a candidate — renders nothing rather than a zero it
   * was never told.
   */
  function pickGrid(entries) {
    // Pickable only where a pick can be served. This grid draws the
    // chooser AND the portfolio, so gating it here covers both; gating
    // only the chooser would leave every portfolio row firing a call
    // the host refuses.
    const canPick = !!host.capabilities.serverTools;
    const grid = el("div", "beads");
    for (const entry of entries) {
      const card = el("button", canPick ? "bead bead--pick" : "bead");
      card.type = "button";
      card.disabled = !canPick;
      const top = el("div", "bead__top");
      top.append(el("span", "bead__id", entry.id));
      top.append(chip(entry.kind || "unknown", entry.kind === "epic" ? "warn" : "idle"));
      card.append(top);
      const displayTitle = (entry.titleSource && entry.titleSource.value) || (entry.identity && entry.identity.displayTitle) || entry.title || entry.beadId || "";
      card.append(el("div", "bead__title", displayTitle));
      // The title states its authority: an id form reads as an id, and a
      // current Beads read is marked live rather than as launch evidence.
      const titleMark = entry.titleSource
        ? (entry.titleSource.known === false ? "untitled id"
          : entry.titleSource.source === "beads.title" ? "live title" : "")
        : "";
      if (titleMark) card.append(el("div", "muted", titleMark));
      if (entry.beadId && displayTitle) card.append(el("div", "muted", entry.beadId));
      const foot = el("div", "bead__foot");
      foot.append(el("span", "", entry.state || "unknown"));
      if (num(entry.liveSeats)) foot.append(el("span", "", `${int(entry.liveSeats)} live`));
      // Key PRESENCE, not truthiness: a measured $0.00 is a fact, and
      // hiding it exactly like an absent key would tell the operator the
      // same thing about two different states.
      if (entry.costUsdKnown !== undefined && entry.costUsdKnown !== null) {
        foot.append(el("span", "", `$${num(entry.costUsdKnown).toFixed(2)}`));
      }
      if (entry.branch) foot.append(el("span", "trunc", entry.branch));
      card.append(foot);
      if (entry.blocker) card.append(el("div", "empty", `Blocked: ${entry.blocker}`));
      if (entry.nextAction) card.append(el("div", "muted", `Next: ${entry.nextAction}`));
      if (canPick) card.addEventListener("click", () => choose(entry));
      grid.append(card);
    }
    return grid;
  }

  /**
   * The root view: every unit of work the ledger holds, newest first.
   *
   * The portfolio states its own bound — `total` against the entries it
   * carries — so a truncated answer reads as truncated. Spend and the
   * attention count cover the WHOLE inventory, not the page.
   */
  function viewPortfolio(data) {
    const entries = arr(data.entries);
    const groups = arr(at(data, "queue.groups"));
    const total = num(data.total);
    const missing = num(at(data, "spend.rowsMissingCost"));
    const needsMe = groups.find((group) => group.name === "Needs me");
    const held = needsMe ? num(needsMe.count) : num(data.attentionTotal);
    // Plan rows are excluded from the durable group, never summed into its
    // headline. And nothing is waiting is a claim about the whole
    // inventory, so it cannot be printed while conditions are open.
    const planned = needsMe ? num(at(needsMe, "excluded.livePlan")) : 0;
    const waiting = num(data.attentionTotal);

    const head = panel("Portfolio", `cap ${int(data.cap)}`);
    const stats = el("div", "spend");
    const stat = (value, key, sub) => {
      const cell = el("div");
      cell.append(el("div", "spend__n", value));
      cell.append(el("div", "spend__k", key));
      if (sub) cell.append(el("div", "spend__sub", sub));
      stats.append(cell);
    };
    stat(int(total), "work items",
      entries.length < total ? `newest ${int(entries.length)} shown` : "all of them");
    stat(int(data.liveSeats), "live seats",
      num(data.liveSeats) ? "executing now" : "nothing is executing");
    stat(int(held), "needs me", held
      ? (planned ? `+${int(planned)} planned · see the queue` : (needsMe ? "see the queue" : "see the rail"))
      : planned ? `+${int(planned)} planned`
      : waiting ? `${int(waiting)} open · see the rail`
      : "nothing is waiting");
    stat(`$${num(at(data, "spend.costUsdKnown")).toFixed(2)}`, "known spend",
      missing ? `${int(missing)} rows carry no cost` : "every row priced");
    head.body.append(stats);

    const box = panel("Work", entries.length < total
      ? `newest ${int(entries.length)} of ${int(total)}`
      : "newest first");
    const body = box.flush();
    if (!entries.length) {
      body.append(el("div", "empty", "Nothing in the ledger yet. Start a run or an epic and it appears here."));
      return [head, box];
    }
    if (groups.length) {
      for (const group of groups) {
        const grouped = arr(group.entries);
        const heading = el("div", "bead__top");
        heading.append(el("strong", "", group.name || "Work"));
        heading.append(el("span", "", `${int(group.count)} total`));
        body.append(heading);
        if (grouped.length) body.append(pickGrid(grouped));
        else body.append(el("div", "empty", "None"));
      }
    } else {
      // Compatibility for an older daemon feeding a newer cached App.
      body.append(pickGrid(entries));
    }
    return [head, box];
  }

  /**
   * Re-ask under the explicit param the entry's kind implies — never the id
   * that failed to resolve. The portfolio is the one subject addressed by
   * ABSENCE, so returning to it is this same click with no param at all.
   */
  function choose(entry) {
    // A host that does not proxy `tools/call` cannot navigate. `refresh`'s
    // own `!host.connected` guard does NOT cover this: the handshake sets
    // `connected` true and only afterwards learns the capability, so the
    // guard passes and the call goes out to a host that will refuse it.
    // `pickGrid` already declines to bind the click; this is the second
    // door, for every other caller.
    if (!host.capabilities.serverTools) return;
    state.args = {
      schemaVersion: 1,
      params: entry.kind === "portfolio"
        ? {}
        : entry.kind === "epic" ? { epic: entry.id } : { run: entry.id },
    };
    refresh();
  }

  /** One click back up to the portfolio, offered by every subject view. */
  function upToPortfolio() {
    const canNavigate = !!host.capabilities.serverTools;
    const up = el("button", "up", "↑ all work");
    up.type = "button";
    up.disabled = !canNavigate;
    up.title = canNavigate
      ? "Every run and epic"
      : "This host does not proxy tool calls";
    if (canNavigate) up.addEventListener("click", () => choose({ kind: "portfolio" }));
    return up;
  }

  // ------------------------------------------------------------------ shell
  const nodes = {
    ident: document.getElementById("ident"),
    identText: document.getElementById("identText"),
    subident: document.getElementById("subident"),
    controls: document.getElementById("controls"),
    rail: document.getElementById("rail"),
    tabs: document.getElementById("tabs"),
    view: document.getElementById("view"),
    foot: document.getElementById("foot"),
    refresh: document.getElementById("refresh"),
    poll: document.getElementById("poll"),
    expand: document.getElementById("expand"),
  };

  /**
   * Draw one attention rail, most blocking first, and hand back what it
   * drew. One shape — `{tone, label, detail}` — whether the items were
   * derived from a subject projection or carried by the portfolio.
   */
  function drawRail(items) {
    const order = { block: 0, warn: 1, info: 2 };
    const sorted = items.slice().sort((a, b) => (order[a.tone] ?? 3) - (order[b.tone] ?? 3));
    for (const item of sorted) {
      const node = el("div", `rail__item rail__item--${item.tone}`);
      node.append(el("div", "rail__label", item.label));
      node.append(el("div", "rail__detail", item.detail));
      nodes.rail.append(node);
    }
    return sorted;
  }

  /**
   * The portfolio's rail items, read from the payload's own conditions.
   *
   * The condition and its evidence are projected, never re-derived here:
   * the App has no ledger to check them against. Only the tone is the
   * App's, because only tone is presentation.
   */
  function portfolioRail(data) {
    const tone = { critical: "block", high: "block", medium: "warn", low: "info" };
    return arr(data.attention).map((item) => ({
      tone: tone[item.severity] || "warn",
      label: String(item.condition || "attention").replace(/-/g, " "),
      detail: `${item.subjectId || item.id} · ${item.detail || ""}`,
    }));
  }

  function render() {
    const data = state.data;
    nodes.view.textContent = "";
    nodes.rail.textContent = "";
    nodes.foot.textContent = "";

    if (state.error) {
      nodes.identText.textContent = "forged";
      nodes.subident.textContent = "the operation was refused";
      nodes.controls.hidden = false;
      nodes.tabs.hidden = true;
      // The one view with no subject and no way out: Refresh repeats the
      // very request that failed. Offer the way back up, so a refusal is a
      // detour rather than a dead end.
      nodes.subident.append(upToPortfolio());
      const box = panel("Refused", state.error.code || "");
      box.body.append(el("p", "", state.error.message || "The overview call returned an error envelope."));
      box.body.firstChild.style.margin = "0";
      if (state.error.detail) {
        const detail = el("pre", "code", JSON.stringify(state.error.detail, null, 2));
        detail.style.marginTop = "12px";
        box.body.append(detail);
      }
      nodes.view.append(box);
      return;
    }
    if (!data) return;

    // A resolution payload has no single subject: no chips, no tabs, no
    // seats — one chooser, and the id the caller asked about.
    if (data.resolution) {
      nodes.identText.textContent = data.resolution.query || "";
      nodes.ident.querySelectorAll(".chip, .ident__copy").forEach((node) => node.remove());
      nodes.ident.append(chip(data.resolution.reason || "unresolved", "warn"));
      nodes.subident.textContent = "";
      nodes.subident.append(upToPortfolio());
      const hint = el("span", "trunc");
      hint.append(el("b", "", "id "), document.createTextNode("names no single run or epic"));
      nodes.subident.append(hint);
      nodes.controls.hidden = false;
      nodes.tabs.hidden = true;
      nodes.view.className = "view view--enter";
      for (const node of viewResolution(data.resolution)) nodes.view.append(node);
      nodes.foot.append(el("span", "", `schema ${data.schema}`));
      reportSize();
      setTimeout(reportSize, 250);
      return;
    }

    // The portfolio has no subject either — it is the level above one. No
    // tabs and no seats: the rail names what needs a human, the view lists
    // what exists, and a click on any entry drills in.
    if (data.kind === "portfolio") {
      nodes.identText.textContent = "all work";
      nodes.ident.querySelectorAll(".chip, .ident__copy").forEach((node) => node.remove());
      const needsMe = arr(at(data, "queue.groups")).find((group) => group.name === "Needs me");
      const held = needsMe ? num(needsMe.count) : num(data.attentionTotal);
      nodes.ident.append(chip(`${int(data.total)} in the ledger`, num(data.liveSeats) ? "live" : "idle"));
      // `attentionTotal` counts CONDITIONS, and one run can raise several —
      // "3 need a human" over two runs would be a lie about how many things
      // are waiting.
      if (held) {
        nodes.ident.append(chip(
          needsMe
            ? `${int(held)} work item${held === 1 ? "" : "s"} need${held === 1 ? "s" : ""} me`
            : `${int(held)} condition${held === 1 ? "" : "s"} need${held === 1 ? "s" : ""} a human`,
          "block",
        ));
      }
      nodes.subident.textContent = "";
      const scope = el("span", "trunc");
      scope.append(el("b", "", "scope "), document.createTextNode("every run and epic"));
      nodes.subident.append(scope);
      nodes.controls.hidden = false;
      nodes.tabs.hidden = true;
      drawRail(portfolioRail(data));
      nodes.view.className = "view view--enter";
      for (const node of viewPortfolio(data)) nodes.view.append(node);
      nodes.foot.append(el("span", "", `schema ${data.schema}`));
      reportSize();
      setTimeout(reportSize, 250);
      return;
    }

    const rows = data.kind === "epic" ? [] : packetRows(data);
    const head = headline(data);

    nodes.identText.textContent = data.id;
    const existing = nodes.ident.querySelectorAll(".chip, .ident__copy");
    existing.forEach((node) => node.remove());
    nodes.ident.append(chip(head.label, head.tone));

    nodes.subident.textContent = "";
    nodes.subident.append(upToPortfolio());
    const bits = data.kind === "epic"
      ? [["kind", "epic"], ["title", at(data, "status.title")], ["branch", at(data, "status.integrationBranch")], ["cursor", data.cursor]]
      : [["kind", "slice"], ["bead", at(data, "status.beadId")], ["branch", at(data, "status.branch")], ["cursor", data.cursor]];
    for (const [label, value] of bits) {
      if (value === undefined || value === null || value === "") continue;
      const span = el("span", "trunc");
      span.append(el("b", "", `${label} `), document.createTextNode(String(value)));
      nodes.subident.append(span);
    }
    if (head.detail) {
      const detail = el("span", "trunc");
      detail.style.color = "var(--color-text-secondary)";
      detail.textContent = head.detail;
      nodes.subident.append(detail);
    }
    nodes.controls.hidden = false;

    const items = drawRail(attention(data, rows));

    const tabs = data.kind === "epic"
      ? [["flow", "Overview", null], ["waves", "Waves", arr(at(data, "status.children")).length],
         ["evidence", "Evidence", arr(data.reviews).length], ["workers", "Workers", arr(data.workers).length],
         ["cost", "Cost", null],
         ["ledger", "Ledger", arr(at(data, "events.events")).length]]
      : [["flow", "Flow", rows.length], ["timeline", "Timeline", null],
         ["evidence", "Evidence", arr(at(data, "reviews.latestFindings")).length],
         ["workers", "Workers", arr(at(data, "workers.sessions")).length],
         ["cost", "Cost", arr(at(data, "usage.rows")).length],
         ["ledger", "Ledger", arr(at(data, "events.events")).length]];
    if (!tabs.some(([key]) => key === state.view)) state.view = "flow";

    nodes.tabs.textContent = "";
    nodes.tabs.hidden = false;
    tabs.forEach(([key, label, count], index) => {
      const tab = el("button", "tab");
      tab.type = "button";
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-selected", String(state.view === key));
      tab.tabIndex = state.view === key ? 0 : -1;
      tab.append(document.createTextNode(label));
      if (count) tab.append(el("span", "tab__n", count));
      tab.addEventListener("click", () => { state.view = key; render(); });
      tab.addEventListener("keydown", (event) => {
        const delta = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
        if (!delta) return;
        event.preventDefault();
        state.view = tabs[(index + delta + tabs.length) % tabs.length][0];
        render();
        nodes.tabs.querySelector('[aria-selected="true"]')?.focus();
      });
      nodes.tabs.append(tab);
    });

    nodes.view.className = "view view--enter";
    const panels = {
      flow: () => viewFlow(data, rows),
      timeline: () => viewTimeline(data, rows),
      evidence: () => viewEvidence(data, rows),
      workers: () => viewWorkers(data, rows),
      waves: () => viewWaves(data),
      cost: () => viewCost(data, rows),
      ledger: () => viewLedger(data),
    }[state.view];
    for (const node of panels()) nodes.view.append(node);

    // ResizeObserver covers layout changes, but a render that lands between
    // observer ticks would leave the host sizing the frame to the previous
    // view. Re-measure on the way out, and once more after fonts settle.
    reportSize();
    setTimeout(reportSize, 250);

    const last = arr(at(data, "events.events")).slice(-1)[0];
    nodes.foot.append(el("span", "", `schema ${data.schema}`));
    if (last) nodes.foot.append(el("span", "", `last event ${last.eventId} · ${ago(last.ts)}`));
    if (state.loading) nodes.foot.append(el("span", "", "refreshing…"));
    pushModelContext(data, rows, head, items);
  }

  /** Keep the model's picture of the run current without a tool round-trip. */
  let lastContext = "";
  function pushModelContext(data, rows, head, items) {
    if (!host.capabilities.updateModelContext) return;
    const lines = [
      `forged ${data.kind} ${data.id}: ${head.label}${head.detail ? ` (${head.detail})` : ""}`,
    ];
    for (const item of items.slice(0, 6)) lines.push(`- ${item.label}: ${item.detail}`);
    if (rows.length) {
      lines.push("seats:");
      for (const row of rows) lines.push(`- ${row.seat} R${row.round} ${row.provider || ""} ${row.model || ""} → ${row.label}${Number.isFinite(row.durationMs) ? ` (${ms(row.durationMs)})` : ""}`);
    }
    const text = lines.join("\n").slice(0, 4000);
    if (text === lastContext) return;
    lastContext = text;
    request("ui/update-model-context", { content: [{ type: "text", text }] }).catch(() => {});
  }

  // -------------------------------------------------------------- ingestion
  function ingest(envelope) {
    const value = envelope && typeof envelope === "object" ? envelope : null;
    if (value && value.ok === false && value.error) {
      state.error = value.error;
      state.data = null;
      render();
      return;
    }
    const data = value?.result ?? value;
    if (!data || data.schema !== "forged.overview/1") {
      state.error = { code: "unexpected", message: "The host returned a payload this view does not know how to draw." };
      state.data = null;
      render();
      return;
    }
    state.error = null;
    state.data = data;
    // Refresh has to have something to send even when the host supplied no
    // arguments at all.
    if (!state.args) state.args = { schemaVersion: 1, params: subjectParams(data) };
    render();
  }

  /**
   * The params that re-ask for exactly this payload.
   *
   * A resolution has no single subject, but it does have the id the caller
   * asked about, and candidates are live work: one that was ambiguous a
   * minute ago can resolve on its own. The portfolio is addressed by
   * ABSENCE, so its params are the empty object — never a `run` key holding
   * an id the payload never had.
   */
  function subjectParams(data) {
    if (data.resolution) return { id: data.resolution.query || "" };
    if (data.kind === "portfolio") return {};
    return data.kind === "epic" ? { epic: data.id } : { run: data.id };
  }

  /** Rebuild capability-gated controls once the host handshake settles. */
  function capabilitiesSettled() {
    if (state.data || state.error) render();
  }

  function readToolResult(params) {
    let value = params?.structuredContent;
    if (!value) {
      const text = arr(params?.content).find((block) => block.type === "text")?.text;
      try { value = JSON.parse(text); } catch { value = null; }
    }
    if (value) ingest(value);
  }

  async function refresh() {
    if (state.loading || !host.connected) return;
    // Nothing to re-ask about is itself a question: with no args and no
    // payload the App asks for the portfolio rather than sending nothing.
    const args = state.data
      ? state.args || { schemaVersion: 1, params: subjectParams(state.data) }
      : state.args || { schemaVersion: 1, params: {} };
    state.loading = true;
    render();
    try {
      const result = await request("tools/call", { name: "overview", arguments: args });
      readToolResult(result);
    } catch (error) {
      state.error = { code: "unreachable", message: String(error.message || error) };
    } finally {
      state.loading = false;
      render();
    }
  }

  function setPoll(seconds) {
    state.pollSeconds = seconds;
    if (state.pollTimer) clearInterval(state.pollTimer);
    state.pollTimer = seconds ? setInterval(refresh, seconds * 1000) : null;
  }

  nodes.refresh.addEventListener("click", refresh);
  nodes.poll.addEventListener("change", () => setPoll(Number(nodes.poll.value)));
  nodes.expand.addEventListener("click", async () => {
    const next = host.context.displayMode === "fullscreen" ? "inline" : "fullscreen";
    try {
      const result = await request("ui/request-display-mode", { mode: next });
      applyContext({ displayMode: result?.mode || next });
    } catch { /* the host may decline; the button simply does nothing */ }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && state.pollSeconds) refresh();
  });

  // ---------------------------------------------------------- host context
  function applyContext(context) {
    if (!context) return;
    host.context = { ...host.context, ...context };
    if (context.theme) {
      document.documentElement.setAttribute("data-theme", context.theme);
      document.documentElement.style.colorScheme = context.theme;
    }
    const variables = context.styles?.variables;
    if (variables) {
      for (const [key, value] of Object.entries(variables)) {
        if (value !== undefined && value !== null) document.documentElement.style.setProperty(key, value);
      }
    }
    const fonts = context.styles?.css?.fonts;
    if (fonts && !document.getElementById("__mcp-host-fonts")) {
      const style = el("style");
      style.id = "__mcp-host-fonts";
      style.textContent = fonts;
      document.head.append(style);
    }
    if (context.displayMode) {
      document.documentElement.setAttribute("data-display", context.displayMode);
      nodes.expand.textContent = context.displayMode === "fullscreen" ? "Collapse" : "Expand";
    }
    const modes = context.availableDisplayModes;
    if (modes) nodes.expand.hidden = !modes.includes("fullscreen");
  }

  // The host sizes the iframe from this notification. Without it a dense view
  // is silently clipped, which is what made the previous version unreadable.
  let sizeQueued = false;
  let lastW = 0;
  let lastH = 0;
  function reportSize() {
    if (sizeQueued) return;
    sizeQueued = true;
    requestAnimationFrame(() => {
      sizeQueued = false;
      const root = document.documentElement;
      const restore = root.style.height;
      root.style.height = "max-content";
      const height = Math.ceil(root.getBoundingClientRect().height);
      root.style.height = restore;
      const width = Math.ceil(window.innerWidth);
      if (width === lastW && height === lastH) return;
      lastW = width; lastH = height;
      notify("ui/notifications/size-changed", { width, height });
    });
  }

  // ---------------------------------------------------------- message loop
  window.addEventListener("message", (event) => {
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;

    if (message.id !== undefined && pending.has(message.id)) {
      const entry = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) entry.reject(new Error(message.error.message || "request failed"));
      else entry.resolve(message.result);
      return;
    }

    switch (message.method) {
      case "ui/notifications/tool-input":
        state.args = message.params?.arguments || state.args;
        break;
      case "ui/notifications/tool-result":
        readToolResult(message.params);
        break;
      case "ui/notifications/tool-cancelled":
        state.loading = false;
        state.error = { code: "cancelled", message: message.params?.reason || "The host cancelled the call." };
        render();
        break;
      case "ui/notifications/host-context-changed":
        applyContext(message.params);
        break;
      case "ui/resource-teardown":
        if (state.pollTimer) clearInterval(state.pollTimer);
        if (message.id !== undefined) post({ jsonrpc: "2.0", id: message.id, result: {} });
        break;
      default:
        break;
    }
  });

  request("ui/initialize", {
    protocolVersion: PROTOCOL_VERSION,
    appInfo: APP_INFO,
    appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
  }).then((result) => {
    host.connected = true;
    host.capabilities = result?.hostCapabilities || {};
    notify("ui/notifications/initialized", {});
    applyContext(result?.hostContext);
    if (!host.capabilities.serverTools) {
      nodes.refresh.disabled = true;
      nodes.poll.disabled = true;
      nodes.refresh.title = "This host does not proxy tool calls.";
    }
    // Any capability-gated control drawn BEFORE this handshake resolved saw
    // an empty capabilities object. Rebuild the current answer whether it is
    // a portfolio, resolution, scoped view, or refusal.
    capabilitiesSettled();
    reportSize();
    const observer = new ResizeObserver(reportSize);
    observer.observe(document.documentElement);
    observer.observe(document.body);
  }).catch(() => {
    nodes.subident.textContent = "The host did not complete the MCP Apps handshake.";
  });
})();
</script>
</body>
</html>
