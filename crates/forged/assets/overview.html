<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forged Control Plane</title>
<style>
/* ---------------------------------------------------------------- tokens
   Every color, font, and radius below is a HOST style variable with a
   fallback. The host overwrites these on the root element at handshake, so
   the app inherits its chrome. The only tokens forged owns outright are the
   execution-state chroma: the host's success/danger are tuned for prose and
   cannot carry five distinguishable states at 8px. */
:root {
  color-scheme: light dark;

  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --color-background-primary: light-dark(#fcfcfb, #131417);
  --color-background-secondary: light-dark(#f5f5f2, #191b1f);
  --color-background-tertiary: light-dark(#eceae5, #21242a);
  --color-text-primary: light-dark(#16181d, #e9eaed);
  --color-text-secondary: light-dark(#585c66, #9ea3ad);
  --color-text-tertiary: light-dark(#82868f, #6d727c);
  --color-text-success: light-dark(#2c7a41, #61b975);
  --color-text-danger: light-dark(#b23a30, #e2776d);
  --color-text-warning: light-dark(#8a6314, #d6a441);
  --color-border-primary: light-dark(#dfddd7, #2b2e35);
  --color-border-secondary: light-dark(#eceae4, #24272d);

  --border-radius-sm: 3px;
  --border-radius-md: 5px;
  --border-radius-lg: 9px;

  /* forged's own: run state chroma. Live is deliberately NOT green — a seat
     that is still thinking has not passed anything yet. */
  --live: light-dark(#0e7d72, #2fc2ae);
  --idle: var(--color-text-tertiary);

  --u: 4px;
  --rule: 1px solid var(--color-border-primary);
  --hair: 1px solid var(--color-border-secondary);
}

* { box-sizing: border-box; min-width: 0; }

body {
  margin: 0;
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  font: 400 13px/1.5 var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

.eyebrow {
  font: 500 10px/1 var(--font-sans);
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
}

button {
  font: inherit; color: inherit; cursor: pointer;
  background: transparent;
  border: var(--rule);
  border-radius: var(--border-radius-md);
  padding: calc(var(--u) * 1.25) calc(var(--u) * 2);
}
button:hover { background: var(--color-background-tertiary); }
button:focus-visible, [tabindex]:focus-visible, a:focus-visible {
  outline: 2px solid var(--live);
  outline-offset: 2px;
}
a { color: inherit; text-decoration-color: var(--color-text-tertiary); text-underline-offset: 2px; }

/* ------------------------------------------------------------------ shell */
#app { padding: calc(var(--u) * 4); display: flex; flex-direction: column; gap: calc(var(--u) * 3); }

.bar { display: flex; align-items: flex-start; gap: calc(var(--u) * 4); flex-wrap: wrap; }
.bar__id { flex: 1 1 260px; }

/* The run id set large in mono: the run's identity IS a machine string. */
.ident {
  font: 500 20px/1.15 var(--font-mono);
  letter-spacing: -.01em;
  display: flex; align-items: center; gap: calc(var(--u) * 2);
  flex-wrap: wrap;
}
.copy {
  border: 0; padding: 1px 5px; margin-left: 4px;
  font: 400 10px/1.4 var(--font-sans); color: var(--color-text-tertiary);
  border-radius: var(--border-radius-sm);
}
.copy:hover { color: var(--color-text-primary); background: var(--color-background-tertiary); }
/* One click back up to the portfolio, from any subject view. */
.up {
  border: 0; padding: 1px 6px;
  font: 400 11px/1.4 var(--font-sans); color: var(--color-text-tertiary);
  border-radius: var(--border-radius-sm);
}
.up:hover { color: var(--color-text-primary); background: var(--color-background-tertiary); }
.subident {
  margin-top: calc(var(--u) * 1.5);
  display: flex; gap: calc(var(--u) * 3); flex-wrap: wrap;
  color: var(--color-text-secondary);
  font-family: var(--font-mono); font-size: 11px;
}
.subident b { font-weight: 400; color: var(--color-text-tertiary); }

.controls { display: flex; align-items: center; gap: var(--u); flex-wrap: wrap; }
.controls select {
  font: 400 11px/1 var(--font-sans); color: inherit;
  background: transparent; border: var(--rule);
  border-radius: var(--border-radius-md); padding: calc(var(--u) * 1.5) var(--u);
}

/* ------------------------------------------------------------------ chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px 3px 8px;
  border: 1px solid currentColor;
  border-radius: var(--border-radius-full, 999px);
  font: 500 11px/1.4 var(--font-sans);
  white-space: nowrap;
}
.chip::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; flex: none;
}
.chip--live { color: var(--live); }
.chip--live::before { animation: pulse 1.9s ease-in-out infinite; }
.chip--pass { color: var(--color-text-success); }
.chip--block { color: var(--color-text-danger); }
.chip--warn { color: var(--color-text-warning); }
.chip--idle { color: var(--idle); }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

/* ------------------------------------------------------------- attention */
.rail { display: flex; flex-direction: column; border: var(--rule); border-radius: var(--border-radius-lg); overflow: hidden; }
.rail__item {
  display: grid; grid-template-columns: 3px 128px 1fr; align-items: baseline;
  gap: calc(var(--u) * 2.5);
  padding: calc(var(--u) * 2) calc(var(--u) * 2.5) calc(var(--u) * 2) 0;
  border-top: var(--hair);
}
.rail__item:first-child { border-top: 0; }
.rail__item::before { content: ""; align-self: stretch; background: currentColor; }
.rail__item--block { color: var(--color-text-danger); }
.rail__item--warn { color: var(--color-text-warning); }
.rail__item--info { color: var(--color-text-tertiary); }
.rail__label { font: 500 10px/1.6 var(--font-sans); letter-spacing: .11em; text-transform: uppercase; }
.rail__detail { color: var(--color-text-primary); font-size: 12px; }
.rail__detail em { color: var(--color-text-secondary); font-style: normal; }

/* -------------------------------------------------------------- tab rail */
.tabs { display: flex; gap: calc(var(--u) * 5); border-bottom: var(--rule); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; border-bottom: 2px solid transparent; border-radius: 0;
  padding: 0 0 calc(var(--u) * 2); margin-bottom: -1px;
  color: var(--color-text-tertiary);
  font: 500 12px/1 var(--font-sans);
  display: flex; align-items: baseline; gap: 6px; white-space: nowrap;
}
.tab:hover { background: transparent; color: var(--color-text-primary); }
.tab[aria-selected="true"] { color: var(--color-text-primary); border-bottom-color: var(--color-text-primary); }
.tab__n { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-tertiary); }

.view { display: flex; flex-direction: column; gap: calc(var(--u) * 3); }
.view--enter { animation: fade .14s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(2px); } }

/* ------------------------------------------------------------- panel */
.panel { border: var(--rule); border-radius: var(--border-radius-lg); }
.panel__head {
  display: flex; align-items: baseline; justify-content: space-between; gap: calc(var(--u) * 3);
  padding: calc(var(--u) * 2.5) calc(var(--u) * 3);
  border-bottom: var(--hair);
}
.panel__note { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-tertiary); }
.panel__body { padding: calc(var(--u) * 3); }
.panel__body--flush { padding: 0; }

.cols { display: grid; gap: calc(var(--u) * 3); grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }

/* key/value list */
.kv { display: grid; grid-template-columns: minmax(88px, auto) 1fr; gap: calc(var(--u) * 1.5) calc(var(--u) * 3); align-items: baseline; }
.kv dt { font: 400 11px/1.5 var(--font-sans); color: var(--color-text-tertiary); }
.kv dd { margin: 0; font-family: var(--font-mono); font-size: 11.5px; overflow-wrap: anywhere; }

/* --------------------------------------------------------- the signature
   Seats × rounds. Rows are the profile's seats in topology order; columns
   are protocol rounds, which are a real typed sequence, so numbering them
   encodes the run rather than decorating it. Reading down a column is one
   round; reading across a row is one seat's behaviour over the whole run. */
.matrix { overflow-x: auto; }
.matrix__grid { display: grid; gap: 1px; background: var(--color-border-secondary); min-width: max-content; }
.matrix__corner, .matrix__round, .matrix__seat, .cell { background: var(--color-background-primary); }
.matrix__corner { padding: calc(var(--u) * 2) calc(var(--u) * 3); }
.matrix__round {
  padding: calc(var(--u) * 2) calc(var(--u) * 3);
  display: flex; align-items: baseline; gap: var(--u);
}
.matrix__round b { font: 500 12px/1 var(--font-mono); }
.matrix__seat {
  padding: calc(var(--u) * 2.5) calc(var(--u) * 3);
  display: flex; flex-direction: column; gap: 3px; justify-content: center;
  position: sticky; left: 0; z-index: 1;
  border-right: var(--hair);
}
.matrix__seat b { font: 500 12px/1.2 var(--font-mono); }
.matrix__seat span { font-size: 10.5px; color: var(--color-text-tertiary); }

.cell { padding: calc(var(--u) * 2.5) calc(var(--u) * 3); min-width: 188px; display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
.cell--empty { background: var(--color-background-secondary); }
.cell__top { display: flex; align-items: center; justify-content: space-between; gap: var(--u); }
.cell__who { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-secondary); overflow-wrap: anywhere; }
.cell__who b { color: var(--color-text-primary); font-weight: 500; }
.cell__meta { display: flex; align-items: baseline; justify-content: space-between; gap: var(--u); font-family: var(--font-mono); font-size: 10.5px; color: var(--color-text-tertiary); }
.cell__dash { font-size: 11px; color: var(--color-text-tertiary); }

/* Duration bar: width is wall-clock, scaled to the longest attempt in the
   run. The matrix doubles as a Gantt without a second chart. */
.dur { height: 3px; background: var(--color-background-tertiary); border-radius: 2px; overflow: hidden; }
.dur__fill { height: 100%; background: currentColor; display: block; border-radius: 2px; }
.dur--live { color: var(--live); }
.dur--pass { color: var(--color-text-success); }
.dur--block { color: var(--color-text-danger); }
.dur--warn { color: var(--color-text-warning); }
.dur--idle { color: var(--idle); }
.dur--live .dur__fill { animation: sweep 1.6s ease-in-out infinite; }
@keyframes sweep { 0% { opacity: .35; } 50% { opacity: 1; } 100% { opacity: .35; } }

/* ------------------------------------------------------------- timeline */
.gantt { display: flex; flex-direction: column; }
.lane {
  display: grid; grid-template-columns: 168px 1fr 62px; align-items: center;
  gap: calc(var(--u) * 2); padding: calc(var(--u) * 1.5) calc(var(--u) * 3);
  border-top: var(--hair);
}
.lane:first-child { border-top: 0; }
.lane__name { font-family: var(--font-mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane__track { position: relative; height: 12px; background: var(--color-background-secondary); border-radius: 2px; }
.lane__bar { position: absolute; top: 0; bottom: 0; min-width: 2px; border-radius: 2px; background: currentColor; }
.lane__bar--live { animation: sweep 1.6s ease-in-out infinite; }
.lane__dur { font-family: var(--font-mono); font-size: 10.5px; color: var(--color-text-tertiary); text-align: right; }
.marks { display: grid; grid-template-columns: 168px 1fr 62px; gap: calc(var(--u) * 2); padding: 0 calc(var(--u) * 3) calc(var(--u) * 1.5); }
.marks__track { position: relative; }
.mark { position: absolute; transform: translateX(-50%); font-family: var(--font-mono); font-size: 9.5px; line-height: 11px; white-space: nowrap; color: var(--color-text-tertiary); }
.mark::after { content: ""; position: absolute; left: 50%; top: 11px; width: 1px; height: var(--tick, 5px); background: var(--color-border-primary); }

/* -------------------------------------------------------------- findings */
.find { display: grid; grid-template-columns: 76px 1fr; gap: calc(var(--u) * 3); padding: calc(var(--u) * 2.5) calc(var(--u) * 3); border-top: var(--hair); }
.find:first-child { border-top: 0; }
.find__sev { font: 500 10px/1.6 var(--font-sans); letter-spacing: .11em; text-transform: uppercase; overflow-wrap: anywhere; }
.find__sev--blocker, .find__sev--high { color: var(--color-text-danger); }
.find__sev--medium { color: var(--color-text-warning); }
.find__sev--low { color: var(--color-text-tertiary); }
/* Seat ids are machine strings, not severity words: set them in mono so they
   do not break mid-word in the label column. */
.find__sev--id { font: 500 11px/1.45 var(--font-mono); letter-spacing: 0; text-transform: none; white-space: pre-line; }
.find__where { font-family: var(--font-mono); font-size: 10.5px; color: var(--color-text-tertiary); margin-bottom: 3px; overflow-wrap: anywhere; }
.find__msg { font-size: 12.5px; line-height: 1.55; overflow-wrap: anywhere; }
.find__msg--clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.find__more {
  border: 0; padding: 2px 0; margin-top: 3px; border-radius: 0;
  font: 400 10.5px/1.4 var(--font-sans); color: var(--color-text-tertiary);
  text-decoration: underline; text-underline-offset: 2px;
}
.find__more:hover { background: transparent; color: var(--color-text-primary); }
.find__src { font-family: var(--font-mono); font-size: 10.5px; color: var(--color-text-tertiary); margin-top: calc(var(--u) * 1.5); overflow-wrap: anywhere; }

/* ----------------------------------------------------------------- table */
.tbl { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 11px; }
.tbl th {
  text-align: left; font: 500 10px/1 var(--font-sans); letter-spacing: .11em; text-transform: uppercase;
  color: var(--color-text-tertiary); padding: calc(var(--u) * 2) calc(var(--u) * 3); border-bottom: var(--hair);
  white-space: nowrap;
}
.tbl td { padding: calc(var(--u) * 2) calc(var(--u) * 3); border-top: var(--hair); vertical-align: top; overflow-wrap: anywhere; }
.tbl tr:first-child td { border-top: 0; }
.tbl .num { text-align: right; }

/* ------------------------------------------------------------------ cost */
.spend { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: calc(var(--u) * 3); }
.spend__n { font: 300 21px/1.1 var(--font-sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.spend__n--soft { color: var(--color-text-tertiary); }
.spend__k { font: 500 9.5px/1 var(--font-sans); letter-spacing: .11em; text-transform: uppercase; color: var(--color-text-tertiary); margin-top: calc(var(--u) * 1.5); }
.spend__sub { font: 400 10.5px/1.4 var(--font-mono); color: var(--color-text-tertiary); margin-top: calc(var(--u) * 1); }
.cost__bar { height: 3px; border-radius: 2px; background: currentColor; opacity: .34; margin-top: 4px; min-width: 1px; margin-left: auto; }
.basis { font: 400 9.5px/1 var(--font-mono); letter-spacing: .04em; color: var(--color-text-tertiary); }
.basis--imputed { color: var(--color-text-warning, var(--color-text-secondary)); }
.provenance { padding: calc(var(--u) * 2.5) calc(var(--u) * 3); font: 400 10.5px/1.5 var(--font-mono); color: var(--color-text-tertiary); border-top: var(--hair); }

/* ---------------------------------------------------------------- ledger */
.filters { display: flex; gap: var(--u); flex-wrap: wrap; padding: calc(var(--u) * 2.5) calc(var(--u) * 3); border-bottom: var(--hair); align-items: center; }
.filters input {
  flex: 1 1 140px; min-width: 120px; font: 400 11px/1 var(--font-mono); color: inherit;
  background: transparent; border: var(--rule); border-radius: var(--border-radius-md);
  padding: calc(var(--u) * 1.5) calc(var(--u) * 2);
}
.filters input::placeholder { color: var(--color-text-tertiary); }
.pill { border: var(--rule); border-radius: 999px; padding: 3px 10px; font: 400 10.5px/1.5 var(--font-mono); color: var(--color-text-secondary); }
.pill[aria-pressed="true"] { color: var(--color-text-primary); border-color: var(--color-text-primary); }

.ev { border-top: var(--hair); }
.ev:first-child { border-top: 0; }
.ev__head {
  display: grid; grid-template-columns: 34px 62px 190px 1fr; gap: calc(var(--u) * 2); align-items: baseline;
  width: 100%; text-align: left; border: 0; border-radius: 0;
  padding: calc(var(--u) * 1.75) calc(var(--u) * 3);
  font-family: var(--font-mono); font-size: 11px;
}
.ev__id { color: var(--color-text-tertiary); text-align: right; }
.ev__ts { color: var(--color-text-tertiary); }
.ev__kind--proto { color: var(--color-text-primary); }
.ev__kind--attempt { color: var(--live); }
.ev__kind--forged { color: var(--color-text-secondary); }
.ev__sum { color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev__body { margin: 0; padding: 0 calc(var(--u) * 3) calc(var(--u) * 3) calc(var(--u) * 12); }
.ev__body pre, .code {
  margin: 0; max-height: 260px; overflow: auto;
  padding: calc(var(--u) * 2.5); border-radius: var(--border-radius-md);
  background: var(--color-background-secondary);
  font: 400 10.5px/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere;
}

/* ----------------------------------------------------------------- waves */
.wave { border-top: var(--hair); padding: calc(var(--u) * 3); }
.wave:first-child { border-top: 0; }
.wave__head { display: flex; align-items: baseline; gap: calc(var(--u) * 2); margin-bottom: calc(var(--u) * 2.5); }
.wave__head b { font: 500 12px/1 var(--font-mono); }
.beads { display: grid; gap: calc(var(--u) * 2); grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); }
.bead { border: var(--rule); border-radius: var(--border-radius-md); padding: calc(var(--u) * 2.5); display: flex; flex-direction: column; gap: var(--u); }
.bead__top { display: flex; align-items: center; justify-content: space-between; gap: var(--u); }
.bead__id { font: 500 11px/1 var(--font-mono); }
.bead__title { font-size: 12px; line-height: 1.4; }
.bead__foot { font-family: var(--font-mono); font-size: 10.5px; color: var(--color-text-tertiary); display: flex; gap: calc(var(--u) * 2); flex-wrap: wrap; }
/* A candidate is a bead card the operator can pick. */
.bead--pick { text-align: left; width: 100%; }

/* ------------------------------------------------------------- utilities */
.empty { padding: calc(var(--u) * 8) calc(var(--u) * 3); text-align: center; color: var(--color-text-tertiary); font-size: 12px; }
.stack { display: flex; flex-direction: column; gap: calc(var(--u) * 2); }
.row-wrap { display: flex; gap: calc(var(--u) * 2); flex-wrap: wrap; align-items: center; }
.scroll { max-height: 420px; overflow: auto; }
/* Fullscreen hands the view real estate; long lists should use it. */
[data-display="fullscreen"] .scroll { max-height: 70vh; }
.foot { display: flex; gap: calc(var(--u) * 3); flex-wrap: wrap; font-family: var(--font-mono); font-size: 10.5px; color: var(--color-text-tertiary); }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="bar__id">
      <div class="ident" id="ident"><span id="identText">forged</span></div>
      <div class="subident" id="subident">Connecting to the host…</div>
    </div>
    <div class="controls" id="controls" hidden>
      <button type="button" id="refresh">Refresh</button>
      <select id="poll" aria-label="Auto refresh">
        <option value="0">Manual</option>
        <option value="10">Every 10s</option>
        <option value="30">Every 30s</option>
        <option value="120">Every 2m</option>
      </select>
      <button type="button" id="expand" hidden>Expand</button>
    </div>
  </div>
  <div id="rail"></div>
  <div class="tabs" id="tabs" role="tablist" hidden></div>
  <div class="view" id="view"><div class="empty">Waiting for a projection.</div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
(() => {
  "use strict";

  // ------------------------------------------------------------ host bridge
  // Hand-written because forged embeds this file with include_str! and ships
  // no JS toolchain; the wire format is the MCP Apps protocol verbatim.
  const PROTOCOL_VERSION = "2026-01-26";
  const APP_INFO = { name: "forged-overview", version: "2.0.0" };

  let rpcId = 0;
  const pending = new Map();
  const post = (message) => window.parent.postMessage(message, "*");
  const notify = (method, params) => post({ jsonrpc: "2.0", method, params: params || {} });

  function request(method, params) {
    const id = `forged-${++rpcId}`;
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      post({ jsonrpc: "2.0", id, method, params: params || {} });
      setTimeout(() => {
        if (pending.delete(id)) reject(new Error(`${method} timed out`));
      }, 120000);
    });
  }

  const host = { capabilities: {}, context: {}, connected: false };

  // ------------------------------------------------------------------ state
  const state = {
    data: null,        // the forged.overview/1 projection
    error: null,       // an operation-envelope error, verbatim
    args: null,        // the arguments the host called `overview` with
    view: "flow",
    pollSeconds: 0,
    pollTimer: null,
    loading: false,
    eventKinds: new Set(),
    eventQuery: "",
    openEvents: new Set(),
    findingScope: "carried",
  };

  // --------------------------------------------------------------- helpers
  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  };
  const arr = (value) => (Array.isArray(value) ? value : []);
  const at = (obj, path) => path.split(".").reduce((v, k) => (v == null ? v : v[k]), obj);
  const num = (value) => (typeof value === "number" && Number.isFinite(value) ? value : 0);
  const int = (value) => Math.round(num(value)).toLocaleString();

  function ms(value) {
    if (!Number.isFinite(value) || value < 0) return "—";
    const s = Math.round(value / 1000);
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m${String(s % 60).padStart(2, "0")}s`;
    return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}m`;
  }

  const stamp = (ts) => (ts ? Date.parse(ts) : NaN);

  function clock(ts) {
    const t = stamp(ts);
    if (!Number.isFinite(t)) return "—";
    const d = new Date(t);
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function ago(ts) {
    const t = stamp(ts);
    if (!Number.isFinite(t)) return "";
    const delta = Date.now() - t;
    if (delta < 0) return "just now";
    return `${ms(delta)} ago`;
  }

  const VERDICT = {
    approve: { label: "approve", tone: "pass" },
    requestChanges: { label: "changes", tone: "warn" },
    block: { label: "block", tone: "block" },
  };

  function chip(label, tone) {
    return el("span", `chip chip--${tone || "idle"}`, label);
  }

  function copyable(text) {
    const node = el("button", "copy", "copy");
    node.title = `Copy ${text}`;
    node.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(text);
        node.textContent = "copied";
      } catch {
        node.textContent = "select it";
      }
      setTimeout(() => { node.textContent = "copy"; }, 1400);
    });
    return node;
  }

  /** Long prose stays scannable: three lines, then the reader opts in. */
  function clampedText(text, threshold) {
    const wrap = el("div");
    const body = el("div", "find__msg", text);
    wrap.append(body);
    if (String(text).length <= threshold) return wrap;
    body.classList.add("find__msg--clamp");
    const more = el("button", "find__more", "show all");
    more.addEventListener("click", () => {
      const clamped = body.classList.toggle("find__msg--clamp");
      more.textContent = clamped ? "show all" : "show less";
    });
    wrap.append(more);
    return wrap;
  }

  function panel(title, note) {
    const box = el("section", "panel");
    const head = el("div", "panel__head");
    head.append(el("h2", "eyebrow", title));
    if (note) head.append(el("span", "panel__note", note));
    box.append(head);
    const body = el("div", "panel__body");
    box.append(body);
    box.body = body;
    box.flush = () => { body.classList.add("panel__body--flush"); return body; };
    return box;
  }

  function kv(pairs) {
    const list = el("dl", "kv");
    for (const [key, value] of pairs) {
      if (value === undefined || value === null || value === "") continue;
      list.append(el("dt", "", key));
      const dd = el("dd");
      if (value instanceof Node) dd.append(value); else dd.textContent = String(value);
      list.append(dd);
    }
    return list;
  }

  // ------------------------------------------------------------ derivation
  // Everything below reads the projection only. The app never guesses a
  // state the ledger did not record.

  const isEpic = () => state.data?.kind === "epic";

  function seatOf(packetId) {
    const parts = String(packetId || "").split("/");
    const round = Number(parts[parts.length - 1]);
    return {
      seat: parts.length > 1 ? parts[parts.length - 2] : String(packetId || ""),
      round: Number.isFinite(round) ? round : 0,
    };
  }

  /** Attempt spans reconstructed from `attempt.state` in the loaded event page. */
  function attemptSpans(data) {
    const spans = new Map();
    const take = (id) => {
      let row = spans.get(id);
      if (!row) { row = { attemptId: id, packetId: null, start: null, end: null, state: null, host: null, fallback: null }; spans.set(id, row); }
      return row;
    };
    for (const event of arr(at(data, "events.events"))) {
      const p = event.payload || {};
      if (event.kind === "attempt.state" && p.attemptId != null) {
        const row = take(p.attemptId);
        row.packetId = row.packetId || p.packetId || null;
        if (p.new === "running") row.start = row.start || event.ts;
        else row.end = event.ts;
        row.state = p.new || row.state;
        if (p.reason) row.reason = p.reason;
      }
      if (event.kind === "forged.session.started" && p.attemptId != null) {
        const row = take(p.attemptId);
        row.packetId = row.packetId || p.packetId || null;
        row.host = p.host || row.host;
        row.sessionId = p.sessionId || row.sessionId;
        row.attachHint = p.attachHint || row.attachHint;
      }
      if (event.kind === "forged.host.fallback" && p.attemptId != null) {
        take(p.attemptId).fallback = p.reason || "host unavailable";
      }
    }
    for (const row of spans.values()) {
      const from = stamp(row.start);
      const to = row.end ? stamp(row.end) : Date.now();
      row.durationMs = Number.isFinite(from) ? to - from : NaN;
      row.live = !row.end && row.state === "running";
    }
    return spans;
  }

  /** One row per packet: who ran it, what it landed, how long it took. */
  function packetRows(data) {
    const status = data.status || {};
    const history = data.packetHistory || {};
    const spans = attemptSpans(data);
    const byPacket = new Map();
    for (const span of spans.values()) {
      if (!span.packetId) continue;
      if (!byPacket.has(span.packetId)) byPacket.set(span.packetId, []);
      byPacket.get(span.packetId).push(span);
    }
    const candidates = new Map(
      arr(at(status, "execution.candidateSelections")).map((c) => [c.packetId, c]),
    );
    const live = new Map(arr(status.liveAttempts).map((a) => [a.packetId, a]));
    const sessions = new Map();
    for (const s of arr(at(data, "workers.sessions"))) sessions.set(s.packetId, s);

    return arr(status.packets).map((packet) => {
      const id = packet.packetId;
      const parsed = seatOf(id);
      const candidate = candidates.get(id) || {};
      const attempts = arr(history[id]);
      const last = attempts[attempts.length - 1] || null;
      const outcome = last?.outcome || null;
      const kind = outcome ? Object.keys(outcome)[0] : null;
      const body = kind ? outcome[kind] : null;
      const liveAttempt = live.get(id) || null;
      const spanList = (byPacket.get(id) || []).sort((a, b) => (stamp(a.start) || 0) - (stamp(b.start) || 0));
      const span = spanList[spanList.length - 1] || null;

      let tone = "idle";
      let label = "not opened";
      if (liveAttempt) {
        tone = liveAttempt.state === "revoking" ? "warn" : "live";
        label = liveAttempt.state;
      } else if (last?.state === "failed") {
        tone = "block"; label = "failed";
      } else if (last?.state === "reclaimed") {
        tone = "warn"; label = "reclaimed";
      } else if (kind === "review" && body?.verdict) {
        const v = VERDICT[body.verdict] || { label: body.verdict, tone: "idle" };
        tone = v.tone; label = v.label;
      } else if (kind === "review" && body && body.available === false) {
        tone = "warn"; label = "unavailable";
      } else if (kind === "implement") {
        tone = body?.implemented ? "pass" : "warn";
        label = body?.implemented ? `+${num(body.commitsAhead)} commits` : "nothing implemented";
      } else if (kind === "fix") {
        tone = body?.applied ? "pass" : "warn";
        label = body?.applied ? "fix applied" : "no fix";
      } else if (last?.state === "completed") {
        tone = "pass"; label = "completed";
      }

      return {
        packetId: id,
        seat: candidate.seatId || parsed.seat,
        round: candidate.round != null ? candidate.round : parsed.round,
        role: candidate.roleId || null,
        purpose: candidate.purpose || null,
        provider: candidate.provider || null,
        model: candidate.model || null,
        effort: candidate.effort || null,
        stage: packet.stage,
        storageLane: packet.storageLane,
        attempts, last, outcome: body, outcomeKind: kind,
        liveAttempt, span, spans: spanList,
        session: sessions.get(id) || null,
        durationMs: span ? span.durationMs : NaN,
        tone, label,
        findings: kind === "review" ? arr(body?.findings) : [],
        summary: body?.summary || null,
      };
    });
  }

  /** The headline: what the ledger says this run is doing right now. */
  function headline(data) {
    if (data.kind === "epic") {
      const status = data.status || {};
      if (status.finalPr) return { tone: "pass", label: "final PR open", detail: `#${at(status, "finalPr.number") ?? "?"}` };
      if (status.inputRequired) return { tone: "block", label: "input required", detail: at(status, "inputRequired.code") || "" };
      if (status.paused) return { tone: "warn", label: "paused", detail: at(status, "paused.reason") || "" };
      const running = arr(status.children).filter((c) => c.runId && !c.merged).length;
      return { tone: running ? "live" : "idle", label: running ? "waves running" : "idle", detail: running ? `${running} child ${running === 1 ? "run" : "runs"} open` : "" };
    }
    const status = data.status || {};
    const next = status.nextAction || {};
    const liveCount = arr(status.liveAttempts).length;
    if (next.stop) {
      const stop = next.stop;
      if (stop.done) {
        const verdict = stop.done.finalVerdict;
        const v = verdict ? VERDICT[verdict] : null;
        return { tone: v ? v.tone : "pass", label: verdict ? `stopped · ${v ? v.label : verdict}` : "stopped · done", detail: "the protocol reached a terminal verdict" };
      }
      if (stop.providerUnavailable) {
        return { tone: "block", label: "stopped · provider unavailable", detail: `${stop.providerUnavailable.stage} after ${num(stop.providerUnavailable.attempts)} attempts` };
      }
      if (stop.externallyStopped) {
        return { tone: "warn", label: "stopped externally", detail: stop.externallyStopped.reason || "" };
      }
      return { tone: "warn", label: "stopped", detail: "" };
    }
    if (liveCount) {
      const revoking = arr(status.liveAttempts).filter((a) => a.state === "revoking").length;
      return revoking
        ? { tone: "warn", label: "reclaiming", detail: `${revoking} attempt${revoking === 1 ? "" : "s"} revoking` }
        : { tone: "live", label: "running", detail: `${liveCount} attempt${liveCount === 1 ? "" : "s"} in flight` };
    }
    if (next.awaitPacket) return { tone: "live", label: "awaiting packet", detail: next.awaitPacket.packetId || "" };
    if (next.openPackets) {
      const seats = arr(next.openPackets).map((i) => i.seat || i.stage).join(", ");
      return { tone: "warn", label: "ready to open", detail: seats };
    }
    if (next.runMachine) return { tone: "warn", label: `machine step · ${next.runMachine}`, detail: "queued, not yet settled" };
    if (next.escalateProfile) return { tone: "warn", label: "escalating profile", detail: `${next.escalateProfile.from} → ${next.escalateProfile.to}` };
    return { tone: "idle", label: status.state || "unknown", detail: "" };
  }

  /** Only what needs the operator. Nothing here is decorative. */
  function attention(data, rows) {
    const items = [];
    const status = data.status || {};
    const push = (tone, label, detail) => items.push({ tone, label, detail });

    if (data.kind === "epic") {
      if (status.inputRequired) push("block", "input required", `${at(status, "inputRequired.childId") || "epic"} · ${at(status, "inputRequired.code") || ""} ${at(status, "inputRequired.detail") || ""}`.trim());
      if (status.paused) push("warn", "paused", at(status, "paused.reason") || "scheduling is held");
    } else {
      const stop = at(status, "nextAction.stop");
      const verdict = at(stop, "done.finalVerdict");
      if (verdict && verdict !== "approve") {
        push("block", "final verdict", `The protocol stopped at ${verdict === "block" ? "block" : "requestChanges"} — the branch is not clear to merge.`);
      }
      if (stop?.providerUnavailable) push("block", "provider unavailable", `${stop.providerUnavailable.stage} gave up after ${num(stop.providerUnavailable.attempts)} attempts.`);
      if (stop?.externallyStopped) push("warn", "stopped externally", stop.externallyStopped.reason || "");
      const controller = status.controller;
      if (controller && controller.state !== "running" && !stop) {
        push("block", "nothing driving", `The detached controller is ${controller.state}. Run \`forged run submit --run ${data.id}\` to hand it back to a driver.`);
      }
    }

    const failed = rows.filter((r) => r.last?.state === "failed");
    if (failed.length) {
      push("block", "attempt failed", failed.map((r) => `${r.seat}: ${r.last.failNote || "no note"}`).join(" · "));
    }
    const reclaimed = rows.filter((r) => r.last?.state === "reclaimed");
    if (reclaimed.length) push("warn", "reclaimed", `${reclaimed.length} attempt${reclaimed.length === 1 ? " was" : "s were"} revoked and reclaimed.`);

    const escalations = arr(at(status, "execution.profileHistory")).filter((h) => h.from);
    for (const step of escalations) {
      push("warn", "profile escalated", `${step.from} → ${at(step, "profile.name")} on ${step.trigger || "an escalation trigger"}.`);
    }

    const gates = arr(data.gates).filter((g) => at(g, "payload.passed") === false);
    for (const gate of gates) {
      const failing = arr(at(gate, "payload.rows")).filter((r) => r.exitCode !== 0 || r.timedOut);
      push("block", `${at(gate, "payload.phase") || "gate"} failed`, failing.map((r) => `${r.command} → ${r.timedOut ? "timed out" : `exit ${r.exitCode}`}`).join(" · "));
    }

    const events = arr(at(data, "events.events"));
    const seatFallback = events.filter((e) => e.kind === "forged.host.fallback");
    const driverFallback = events.filter((e) => e.kind === "forged.controller.host.fallback");
    if (seatFallback.length || driverFallback.length) {
      const sample = seatFallback[0] || driverFallback[0];
      const who = [
        seatFallback.length ? `${seatFallback.length} attempt${seatFallback.length === 1 ? "" : "s"}` : null,
        driverFallback.length ? "the controller" : null,
      ].filter(Boolean).join(" and ");
      push("warn", "host fallback", `${who} fell back off ${at(sample, "payload.requested") || "herdr"} — ${at(sample, "payload.reason") || "the requested host was unavailable"}. Sessions started this way cannot be attached or messaged live.`);
    }

    const retries = arr(at(data, "events.events")).filter((e) => e.kind === "proto.retry");
    if (retries.length) {
      const worst = retries[retries.length - 1];
      push("warn", "transport retry", `${retries.length} granted; ${at(worst, "payload.packetId")} has ${num(at(worst, "payload.transportFailures"))} transport failures, next claim after ${at(worst, "payload.retryAfter")}.`);
    }

    const quarantine = arr(at(data, "events.events")).filter((e) => e.kind === "proto.quarantine");
    if (quarantine.length) push("block", "quarantined", `${quarantine.length} zombie result${quarantine.length === 1 ? " was" : "s were"} refused at the fence and taken into custody.`);

    const pending = num(at(data, "workers.pendingInterventions"));
    if (pending) push("warn", "interventions queued", `${pending} message${pending === 1 ? "" : "s"} waiting for the next provider boundary.`);

    // Reviewer dissent in the latest round is the signal that produced the
    // escalation; naming it saves reading six cells.
    const reviews = rows.filter((r) => r.purpose === "review" && r.outcomeKind === "review");
    if (reviews.length > 1) {
      const round = Math.max(...reviews.map((r) => r.round));
      const latest = reviews.filter((r) => r.round === round && r.outcome?.verdict);
      const verdicts = new Set(latest.map((r) => r.outcome.verdict));
      if (verdicts.size > 1) {
        const tally = {};
        for (const r of latest) tally[r.outcome.verdict] = (tally[r.outcome.verdict] || 0) + 1;
        push("warn", "reviewers split", `Round ${round}: ${Object.entries(tally).map(([v, n]) => `${n} ${VERDICT[v]?.label || v}`).join(", ")}.`);
      }
    }

    if (num(at(data, "usage.totals.rowsMissingCost"))) {
      push("info", "cost incomplete", `${int(at(data, "usage.totals.rowsMissingCost"))} usage rows carry no price. Run \`forged usage ingest --run ${data.id}\` to fill them.`);
    }
    return items;
  }

  // ------------------------------------------------------------ views
  function viewFlow(data, rows) {
    const out = [];
    const status = data.status || {};

    // What happens next, in words.
    const next = status.nextAction || {};
    const nextText = (() => {
      if (data.kind === "epic") {
        if (status.finalPr) return `The epic PR is open at ${at(status, "finalPr.url") || `#${at(status, "finalPr.number")}`}.`;
        if (status.inputRequired) return `A child is holding for input: ${at(status, "inputRequired.detail") || at(status, "inputRequired.code")}.`;
        if (status.paused) return "Scheduling is paused. Resume it to continue the wave.";
        return "The scheduler advances the current wave on the next drive.";
      }
      if (next.stop) return "This run is over. Nothing further will be scheduled.";
      if (next.awaitPacket) return `Waiting on ${next.awaitPacket.packetId}${next.awaitPacket.notBefore ? ` until ${clock(next.awaitPacket.notBefore)}` : ""}.`;
      if (next.openPackets) return `Next drive opens ${arr(next.openPackets).map((i) => i.seat || i.stage).join(", ")}.`;
      if (next.runMachine) return `Next drive runs the ${next.runMachine} machine step.`;
      if (next.escalateProfile) return `Next drive escalates ${next.escalateProfile.from} → ${next.escalateProfile.to}.`;
      return "No action is queued.";
    })();

    const driver = status.controller;
    const lastEvent = arr(at(data, "events.events")).slice(-1)[0];
    const nowPanel = panel("Next action", "");
    const nowCols = el("div", "cols");
    const sentence = el("div", "", nextText);
    sentence.style.gridColumn = "1 / -1";
    nowCols.append(sentence);
    nowCols.append(kv([
      ["driver", driver
        ? `${driver.host} · ${driver.state}${driver.pid ? ` · pid ${driver.pid}` : ""}`
        : "no detached controller"],
      ["in flight", `${arr(status.liveAttempts).length} attempt${arr(status.liveAttempts).length === 1 ? "" : "s"}`],
    ]));
    nowCols.append(kv([
      ["last event", lastEvent ? `${lastEvent.kind} · ${ago(lastEvent.ts)}` : null],
      ["settled ops", arr(status.settledOperations).length || null],
    ]));
    nowPanel.body.append(nowCols);
    out.push(nowPanel);

    if (data.kind !== "epic") out.push(matrixPanel(data, rows));

    // Definition: what this run was frozen against.
    const definition = status.definition || {};
    const execution = status.execution || {};
    const escalations = arr(execution.profileHistory).filter((h) => h.from);
    const policy = definition.policy || {};
    const defPanel = panel("Definition", data.kind === "epic" ? "" : status.protocolMode || "");
    const cols = el("div", "cols");
    cols.append(kv([
      ["protocol", at(execution, "protocolRef.name") || at(definition, "protocolRef.name")],
      ["profile", escalations.length
        ? `${arr(execution.profileHistory).map((h) => at(h, "profile.name")).join(" → ")}`
        : at(execution, "activeProfileRef.name") || at(definition, "profileRef.name") || status.profile],
      ["roster", at(definition, "activeRosterRef.name") || at(definition, "rosterRef.name") || status.roster],
      ["revision", definition.rosterRevision != null ? `r${definition.rosterRevision}` : (arr(data.rosterRevisions).length ? `r${arr(data.rosterRevisions).slice(-1)[0].revision}` : null)],
    ]));
    cols.append(kv([
      ["repo", status.repo],
      ["branch", status.branch || status.integrationBranch],
      ["base", status.baseRef],
      ["bead", status.beadId],
    ]));
    cols.append(kv([
      ["gates", (() => {
        const commands = arr(policy.gateCommands);
        if (!commands.length) return null;
        const list = el("div", "stack");
        for (const command of commands) list.append(el("div", "trunc", command));
        return list;
      })()],
      ["host policy", policy.hostPolicy],
      ["retry budget", policy.transportRetryBudget],
      ["fix rounds", at(execution, "topology.fixRoundBudget")],
    ]));
    defPanel.body.append(cols);
    out.push(defPanel);

    // Usage. Zero known cost is not the same as free; say which one it is.
    const totals = at(data, "usage.totals") || {};
    const recorded = num(totals.inputTokens) + num(totals.outputTokens);
    const usagePanel = panel("Usage", recorded ? "" : "no usage ingested");
    const usageCols = el("div", "cols");
    usageCols.append(kv([
      ["input", recorded ? int(totals.inputTokens) : "—"],
      ["output", recorded ? int(totals.outputTokens) : "—"],
    ]));
    usageCols.append(kv([
      ["cache read", recorded ? int(totals.cacheReadTokens) : "—"],
      ["cache write", recorded ? int(totals.cacheWriteTokens) : "—"],
    ]));
    usageCols.append(kv([
      ["known cost", num(totals.costUsdKnown) ? `$${num(totals.costUsdKnown).toFixed(3)}` : recorded ? "$0.000" : "—"],
      ["unpriced rows", int(totals.rowsMissingCost)],
    ]));
    usagePanel.body.append(usageCols);
    out.push(usagePanel);
    return out;
  }

  function matrixPanel(data, rows) {
    const seats = arr(at(data, "status.execution.topology.seats"));
    const rounds = [...new Set(rows.map((r) => r.round))].sort((a, b) => a - b);
    const box = panel("Seats × rounds", `${rows.length} packet${rows.length === 1 ? "" : "s"}`);
    const body = box.flush();

    if (!rows.length) {
      body.append(el("div", "empty", "No packets have been opened yet."));
      return box;
    }

    // Rows follow topology order when the run is definition-backed; a legacy
    // run falls back to first-seen order so it still renders.
    const seatOrder = seats.length
      ? seats.map((s) => ({ id: s.id, role: s.role, purpose: s.purpose }))
      : [...new Set(rows.map((r) => r.seat))].map((id) => {
          const first = rows.find((r) => r.seat === id);
          return { id, role: first?.role || first?.storageLane, purpose: first?.purpose };
        });

    const longest = Math.max(1, ...rows.map((r) => (Number.isFinite(r.durationMs) ? r.durationMs : 0)));

    const wrap = el("div", "matrix");
    const grid = el("div", "matrix__grid");
    grid.style.gridTemplateColumns = `minmax(140px, auto) repeat(${rounds.length}, minmax(188px, 1fr))`;

    grid.append(el("div", "matrix__corner"));
    for (const round of rounds) {
      const head = el("div", "matrix__round");
      head.append(el("b", "", `R${round}`));
      head.append(el("span", "eyebrow", round === 0 ? "first pass" : "after fix"));
      grid.append(head);
    }

    for (const seat of seatOrder) {
      const label = el("div", "matrix__seat");
      label.append(el("b", "", seat.id));
      if (seat.role) label.append(el("span", "", seat.role));
      grid.append(label);
      for (const round of rounds) {
        const row = rows.find((r) => r.seat === seat.id && r.round === round);
        if (!row) {
          const empty = el("div", "cell cell--empty");
          empty.append(el("span", "cell__dash", "—"));
          grid.append(empty);
          continue;
        }
        grid.append(matrixCell(row, longest));
      }
    }
    wrap.append(grid);
    body.append(wrap);
    return box;
  }

  function matrixCell(row, longest) {
    const cell = el("div", "cell");
    const top = el("div", "cell__top");
    const who = el("div", "cell__who");
    if (row.provider) {
      who.append(el("b", "", row.provider));
      who.append(document.createTextNode(` ${row.model || ""}${row.effort ? ` · ${row.effort}` : ""}`));
    } else {
      who.textContent = row.storageLane || "—";
    }
    top.append(who, chip(row.label, row.tone));
    cell.append(top);

    const bar = el("div", `dur dur--${row.tone}`);
    const fill = el("span", "dur__fill");
    const width = Number.isFinite(row.durationMs) ? Math.max(2, (row.durationMs / longest) * 100) : 2;
    fill.style.width = `${Math.min(100, width)}%`;
    bar.append(fill);
    cell.append(bar);

    const meta = el("div", "cell__meta");
    meta.append(el("span", "", Number.isFinite(row.durationMs) ? ms(row.durationMs) : "—"));
    const right = row.findings.length
      ? `${row.findings.length} finding${row.findings.length === 1 ? "" : "s"}`
      : row.last ? `attempt ${row.last.attemptId}` : "";
    meta.append(el("span", "trunc", right));
    cell.append(meta);
    if (row.summary) cell.title = row.summary;
    return cell;
  }

  function viewTimeline(data, rows) {
    const spans = [...attemptSpans(data).values()].filter((s) => s.start).sort((a, b) => stamp(a.start) - stamp(b.start));
    const box = panel("Attempt timeline", `${spans.length} attempt${spans.length === 1 ? "" : "s"} in the loaded event window`);
    const body = box.flush();
    if (!spans.length) {
      body.append(el("div", "empty", "No attempt transitions in the loaded events."));
      return [box];
    }

    const t0 = stamp(spans[0].start);
    const live = spans.some((s) => s.live);
    const t1 = Math.max(...spans.map((s) => (s.end ? stamp(s.end) : Date.now())));
    const width = Math.max(1, t1 - t0);
    const seatFor = new Map(rows.map((r) => [r.packetId, r]));

    // Milestones sit above the lanes. Runs cluster them — a gate settles and
    // the PR opens three seconds later — so labels stagger onto extra rows
    // rather than overprinting each other.
    const marksRow = el("div", "marks");
    marksRow.append(el("div"));
    const track = el("div", "marks__track");
    const milestones = arr(at(data, "events.events"))
      .filter((e) => ["proto.gate", "proto.pr", "forged.profile.escalated", "forged.epic.wave.started", "proto.quarantine"].includes(e.kind))
      .map((event) => ({ event, t: stamp(event.ts) }))
      .filter((m) => Number.isFinite(m.t))
      .sort((a, b) => a.t - b.t);

    const lanes = [];
    let deepest = 0;
    for (const { event, t } of milestones) {
      const left = Math.min(99, Math.max(1, ((t - t0) / width) * 100));
      let level = 0;
      while (lanes[level] !== undefined && left - lanes[level] < 11) level += 1;
      lanes[level] = left;
      deepest = Math.max(deepest, level);
      const mark = el("div", "mark", {
        "proto.gate": `${at(event, "payload.phase") || "gate"}${at(event, "payload.passed") === false ? " ✗" : ""}`,
        "proto.pr": `PR #${at(event, "payload.number")}`,
        "forged.profile.escalated": `→ ${at(event, "payload.to")}`,
        "forged.epic.wave.started": `wave ${at(event, "payload.wave")}`,
        "proto.quarantine": "quarantine",
      }[event.kind] || event.kind);
      mark.style.left = `${left}%`;
      mark.style.top = `${level * 13}px`;
      mark.style.setProperty("--tick", `${(deepest - level) * 13 + 13}px`);
      if (at(event, "payload.passed") === false) mark.style.color = "var(--color-text-danger)";
      mark.title = `${clock(event.ts)} · ${event.kind}`;
      track.append(mark);
    }
    track.style.height = `${deepest * 13 + 18}px`;
    for (const mark of track.children) {
      const level = Number(String(mark.style.top).replace("px", "")) / 13;
      mark.style.setProperty("--tick", `${(deepest - level) * 13 + 14}px`);
    }
    marksRow.append(track, el("div"));
    body.append(marksRow);

    const gantt = el("div", "gantt");
    for (const span of spans) {
      const row = span.packetId ? seatFor.get(span.packetId) : null;
      const lane = el("div", "lane");
      const name = el("div", "lane__name");
      name.textContent = row ? `${row.seat} · R${row.round}` : span.packetId || `attempt ${span.attemptId}`;
      name.title = span.packetId || "";
      lane.append(name);

      const laneTrack = el("div", "lane__track");
      const bar = el("div", `lane__bar${span.live ? " lane__bar--live" : ""}`);
      const start = ((stamp(span.start) - t0) / width) * 100;
      const end = (((span.end ? stamp(span.end) : Date.now()) - t0) / width) * 100;
      bar.style.left = `${Math.max(0, start)}%`;
      bar.style.width = `${Math.max(0.6, end - start)}%`;
      bar.style.color = `var(--${{ live: "live", pass: "color-text-success", block: "color-text-danger", warn: "color-text-warning" }[row ? row.tone : "idle"] || "idle"})`;
      bar.title = `${clock(span.start)} → ${span.end ? clock(span.end) : "now"}`;
      laneTrack.append(bar);
      lane.append(laneTrack);
      lane.append(el("div", "lane__dur", Number.isFinite(span.durationMs) ? ms(span.durationMs) : "—"));
      gantt.append(lane);
    }
    body.append(gantt);

    const foot = el("div", "filters");
    foot.style.borderBottom = "0";
    foot.style.borderTop = "1px solid var(--color-border-secondary)";
    foot.append(el("span", "panel__note", `${clock(spans[0].start)} → ${live ? "now" : clock(spans[spans.length - 1].end)} · ${ms(width)} wall clock`));
    body.append(foot);
    return [box];
  }

  function viewEvidence(data, rows) {
    const out = [];

    // Findings. `carried` is what the engine hands the fix seat; `all` is
    // every reviewer's own list, which is where dissent is legible.
    const carried = data.kind === "epic" ? arr(data.reviews) : arr(at(data, "reviews.latestFindings"));
    const perSeat = rows.filter((r) => r.findings.length);
    const allCount = perSeat.reduce((n, r) => n + r.findings.length, 0);

    const box = panel("Review findings", "");
    const head = box.querySelector(".panel__head");
    const toggle = el("div", "row-wrap");
    for (const [key, label, count] of [["carried", "carried forward", carried.length], ["all", "every seat", allCount]]) {
      const button = el("button", "pill", `${label} · ${count}`);
      button.setAttribute("aria-pressed", String(state.findingScope === key));
      button.addEventListener("click", () => { state.findingScope = key; render(); });
      toggle.append(button);
    }
    head.append(toggle);
    const body = box.flush();

    const rank = { blocker: 0, high: 1, medium: 2, low: 3 };
    const findingRow = (finding, source) => {
      const node = el("div", "find");
      node.append(el("div", `find__sev find__sev--${finding.severity}`, finding.severity));
      const right = el("div");
      if (finding.file) right.append(el("div", "find__where", `${finding.file}${finding.line ? `:${finding.line}` : ""}`));
      right.append(clampedText(finding.message, 260));
      if (source) right.append(el("div", "find__src", source));
      node.append(right);
      return node;
    };

    if (state.findingScope === "carried") {
      const sorted = [...carried].sort((a, b) => (rank[a.severity] ?? 9) - (rank[b.severity] ?? 9));
      if (!sorted.length) body.append(el("div", "empty", "No findings were carried into the fix round."));
      for (const finding of sorted) body.append(findingRow(finding, null));
    } else if (!allCount) {
      body.append(el("div", "empty", "No reviewer has landed findings yet."));
    } else {
      for (const row of [...perSeat].sort((a, b) => b.round - a.round || a.seat.localeCompare(b.seat))) {
        for (const finding of [...row.findings].sort((a, b) => (rank[a.severity] ?? 9) - (rank[b.severity] ?? 9))) {
          body.append(findingRow(finding, `${row.seat} · R${row.round} · ${row.provider || "?"} ${row.model || ""} · ${VERDICT[row.outcome?.verdict]?.label || "—"}`));
        }
      }
    }
    out.push(box);

    // Seat summaries: what each seat said in its own words.
    const summaries = rows.filter((r) => r.summary);
    if (summaries.length) {
      const sBox = panel("Seat reports", `${summaries.length}`);
      const sBody = sBox.flush();
      for (const row of summaries.sort((a, b) => a.round - b.round || a.seat.localeCompare(b.seat))) {
        const item = el("div", "find");
        item.append(el("div", "find__sev find__sev--id", `${row.seat}\nR${row.round}`));
        const right = el("div");
        right.append(el("div", "find__where", `${row.provider || ""} ${row.model || ""}${row.outcome?.verdict ? ` · ${VERDICT[row.outcome.verdict]?.label || row.outcome.verdict}` : ""}`.trim()));
        right.append(clampedText(row.summary, 300));
        item.append(right);
        sBody.append(item);
      }
      out.push(sBox);
    }

    // Gates.
    const gates = arr(data.gates);
    const gBox = panel("Gates", `${gates.length} pass${gates.length === 1 ? "" : "es"}`);
    const gBody = gBox.flush();
    if (!gates.length) gBody.append(el("div", "empty", "No gate has run yet."));
    for (const gate of gates) {
      const payload = gate.payload || {};
      const head = el("div", "filters");
      head.append(el("span", "eyebrow", `${payload.phase || "gate"} · round ${num(payload.seq)}`));
      head.append(chip(payload.passed ? "passed" : "failed", payload.passed ? "pass" : "block"));
      head.append(el("span", "panel__note", clock(gate.ts)));
      gBody.append(head);
      const table = el("table", "tbl");
      const thead = el("thead");
      const hr = el("tr");
      for (const [label, cls] of [["command", ""], ["exit", "num"], ["took", "num"], ["output", ""]]) hr.append(el("th", cls, label));
      thead.append(hr); table.append(thead);
      const tbody = el("tbody");
      for (const row of arr(payload.rows)) {
        const tr = el("tr");
        tr.append(el("td", "", row.command));
        const exit = el("td", "num", row.timedOut ? "timeout" : String(row.exitCode ?? "—"));
        exit.style.color = row.timedOut || row.exitCode !== 0 ? "var(--color-text-danger)" : "var(--color-text-success)";
        tr.append(exit);
        tr.append(el("td", "num", ms(num(row.durationMs))));
        const preview = el("td", "", (row.stderrPreview || row.stdoutPreview || "").split("\n").slice(0, 2).join(" · ").slice(0, 160));
        preview.style.color = "var(--color-text-tertiary)";
        tr.append(preview);
        tbody.append(tr);
      }
      table.append(tbody);
      gBody.append(table);
    }
    out.push(gBox);

    // Artifacts.
    const artifacts = arr(data.artifacts).filter((a) => arr(a.files).length);
    if (artifacts.length) {
      const aBox = panel("Artifacts", `${artifacts.reduce((n, a) => n + arr(a.files).length, 0)} files`);
      const aBody = aBox.flush();
      const table = el("table", "tbl");
      const tbody = el("tbody");
      for (const group of artifacts) {
        const tr = el("tr");
        tr.append(el("td", "", group.packetId));
        tr.append(el("td", "", arr(group.files).map((f) => f.split("/").pop()).join("  ")));
        const dir = el("td");
        dir.append(el("span", "trunc", group.directory));
        dir.style.color = "var(--color-text-tertiary)";
        tr.append(dir);
        tbody.append(tr);
      }
      table.append(tbody);
      aBody.append(table);
      out.push(aBox);
    }
    return out;
  }

  function viewWorkers(data, rows) {
    const out = [];
    const sessions = data.kind === "epic" ? arr(data.workers) : arr(at(data, "workers.sessions"));
    const seatFor = new Map(rows.map((r) => [r.packetId, r]));

      body.append(el("div", "empty", "No provider session has started."));
    } else {
      const table = el("table", "tbl");
      const thead = el("thead"); const hr = el("tr");
      for (const label of ["attempt", "seat", "state", "host", "session", "attach"]) hr.append(el("th", "", label));

      const tbody = el("tbody");
      for (const session of sessions) {

        ["host", controller.host],

        ["session", controller.sessionId],

      for (const label of ["rev", "roster", "reason", "when"]) hr.append(el("th", "", label));
      thead.append(hr); table.append(thead);
      const tbody = el("tbody");
      for (const revision of revisions) {

        tr.append(el("td", "num", `r${revision.revision}`));
        tr.append(el("td", "", at(revision, "rosterRef.name") || ""));

      table.append(tbody);

    return out;
