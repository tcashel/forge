<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forged Work Detail</title>
<style>
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, light-dark(#fbfbfa,#141519));
  --panel: var(--color-background-secondary, light-dark(#f4f4f1,#1b1d22));
  --ink: var(--color-text-primary, light-dark(#17191e,#eceef1));
  --muted: var(--color-text-secondary, light-dark(#626773,#a3a8b2));
  --line: var(--color-border-primary, light-dark(#deddd7,#30333a));
  --bad: var(--color-text-danger, light-dark(#b43c31,#e87b70));
  --good: var(--color-text-success, light-dark(#287a43,#6bc27e));
  --warn: var(--color-text-warning, light-dark(#8b6313,#ddb04d));
  --accent: light-dark(#167b72,#42c9b7);
  --state-attend: light-dark(#a62f48,#ff879a);
  --state-running: light-dark(#176f9f,#66c7f2);
  --state-stalled: light-dark(#93610b,#e8b34f);
  --state-landed: light-dark(#287a43,#76cf8b);
  --state-dormant: light-dark(#6d6875,#aaa4b2);
  --sans: ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono: ui-monospace,SFMono-Regular,Menlo,monospace;
}
* { box-sizing: border-box; min-width: 0; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); }
button { font: inherit; color: inherit; cursor: pointer; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
button:disabled { opacity: .55; cursor: default; } button:hover:not(:disabled) { background: var(--panel); } button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { padding: 16px; display: grid; gap: 14px; }
.top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
h1 { margin: 0; font: 600 19px/1.25 var(--mono); overflow-wrap: anywhere; }
.sub { margin-top: 4px; color: var(--muted); font-size: 11px; }
.headline { margin:0; overflow:hidden; font-weight:500; text-overflow:ellipsis; white-space:nowrap; }
.state { border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; font: 11px/1.3 var(--mono); }
.summary { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.summary div { padding: 10px 12px; border-left: 1px solid var(--line); }.summary div:first-child { border-left: 0; }
.summary b { display: block; font: 600 17px/1.2 var(--mono); }.summary span { color: var(--muted); font-size: 11px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(270px,1fr)); gap: 12px; align-items: start; }
.panel { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.panel h2 { margin: 0; padding: 9px 11px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12px; }
.body { padding: 10px 11px; display: grid; gap: 7px; }
.kv { display: grid; grid-template-columns: 105px 1fr; gap: 5px 9px; margin: 0; }.kv dt { color: var(--muted); }.kv dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }
.item { padding-top: 7px; border-top: 1px solid var(--line); }.item:first-child { padding-top: 0; border-top: 0; }
.item b { font-family: var(--mono); font-size: 11px; }.item p { margin: 3px 0 0; overflow-wrap: anywhere; }
.item p.note { color: var(--muted); font-size: 11px; }
.panel h2 .note { color: var(--muted); font-weight: 400; }
/* Chips, ages and clock times are the same across all five Apps. */
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid currentColor; border-radius: 999px; padding: 2px 7px; font: 500 10px/1.35 var(--sans); white-space: nowrap; color: var(--muted); vertical-align: middle; }
.chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
.chip--live,.chip--pass { color: var(--good); }.chip--warn { color: var(--warn); }.chip--block { color: var(--bad); }.chip--idle { color: var(--muted); }
.chip--attend { color:var(--state-attend); }.chip--running { color:var(--state-running); }.chip--stalled { color:var(--state-stalled); }.chip--landed { color:var(--state-landed); }.chip--dormant { color:var(--state-dormant); }
.semantic-chip { margin-right:5px; }
.age--quiet { color:var(--muted); }.age--amber { color:var(--state-stalled); }.age--loud { color:var(--state-attend); font-weight:600; }
/* The canonical selector is demoted, never hidden: it addresses every
   follow-up call, so it stays selectable even inside a row that is itself a
   button. */
.chip--id { font-family: var(--mono); -webkit-user-select: text; user-select: text; }
.chip--id::before { display: none; }
.empty,.error { border: 1px dashed var(--line); border-radius: 8px; padding: 18px; color: var(--muted); }.error { color: var(--bad); border-color: currentColor; }
.foot { color: var(--muted); font: 10px/1.4 var(--mono); display: flex; gap: 12px; flex-wrap: wrap; }
@media(max-width:560px) { .summary { grid-template-columns: 1fr 1fr; }.summary div { border-top: 1px solid var(--line); border-left: 0; } }
</style>
</head>
<body>
<main id="app">
  <header class="top"><div><h1 id="title">Work detail</h1><div class="sub" id="subtitle">Waiting for an exact subject.</div></div><div><span class="chip semantic-chip chip--dormant" id="semantic">dormant</span><span class="state" id="state">unknown</span> <button type="button" id="refresh">Refresh</button> <button type="button" id="expand" hidden>Expand</button></div></header>
  <p class="headline" id="headline"></p>
  <section class="summary" id="summary"></section>
  <section class="grid" id="grid"><div class="empty">Waiting for detail.</div></section>
  <footer class="foot" id="foot"></footer>
</main>
<script>

  function spendText(spend){if(!spend||(!Object.hasOwn(spend,"costUsdKnown")&&!Object.hasOwn(spend,"rowsMissingCost")))return null;const known=num(spend.costUsdKnown),missing=num(spend.rowsMissingCost);if(missing>0&&known===0)return `? (${Math.round(missing).toLocaleString()} unpriced)`;return `$${known.toFixed(2)}${missing>0?` + ${Math.round(missing).toLocaleString()} unpriced`:""}`;}
  function degradedSources(data){if(!data?.sourceHealth)return [];const degraded=[];for(const [name,source] of Object.entries(data.sourceHealth)){const status=source?.state||"unknown";if(status!=="available")degraded.push(`${name} ${status}`);}return degraded;}
  function reducedHeadline(data){const parts=[];const degraded=degradedSources(data);if(degraded.length)parts.push(`Degraded sources: ${degraded.join(", ")}`);const state=subjectState(data);if(state)parts.push(`${data?.workRef?.kind||data?.kind||"work"} ${data?.id||"unknown"} is ${state}`);const findings=data?.reviews?.latestFindingTotal??(Array.isArray(data?.reviews?.latestFindings)?data.reviews.latestFindings.length:null);if(typeof findings==="number")parts.push(`${Math.round(findings).toLocaleString()} findings`);const attention=typeof data?.attentionTotal==="number"?data.attentionTotal:Array.isArray(data?.attention)?data.attention.length:null;if(typeof attention==="number")parts.push(`${Math.round(attention).toLocaleString()} attention`);const spend=spendText(data?.usage?.totals);if(spend!=null)parts.push(`${spend} known spend`);return `${parts.join("; ")}.`;}
