<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forged Operations</title>
<style>
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, light-dark(#fbfbfa, #141519));
  --panel: var(--color-background-secondary, light-dark(#f4f4f1, #1b1d22));
  --ink: var(--color-text-primary, light-dark(#17191e, #eceef1));
  --muted: var(--color-text-secondary, light-dark(#626773, #a3a8b2));
  --line: var(--color-border-primary, light-dark(#deddd7, #30333a));
  --good: var(--color-text-success, light-dark(#287a43, #6bc27e));
  --warn: var(--color-text-warning, light-dark(#8b6313, #ddb04d));
  --bad: var(--color-text-danger, light-dark(#b43c31, #e87b70));
  --accent: light-dark(#167b72, #42c9b7);
  --state-attend: light-dark(#a62f48, #ff879a);
  --state-running: light-dark(#176f9f, #66c7f2);
  --state-stalled: light-dark(#93610b, #e8b34f);
  --state-landed: light-dark(#287a43, #76cf8b);
  --state-dormant: light-dark(#6d6875, #aaa4b2);
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; min-width: 0; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
button:hover:not(:disabled) { background: var(--panel); }
button:disabled { cursor: default; opacity: .55; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { padding: 16px; display: grid; gap: 14px; }
.top { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
h1 { margin: 0; font: 600 20px/1.2 var(--sans); letter-spacing: -.02em; }
.sub, .muted { color: var(--muted); }
.sub { margin-top: 4px; font-family: var(--mono); font-size: 11px; }
.headline { margin: 0; overflow: hidden; color: var(--ink); font-size: 13px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.controls { display: flex; gap: 6px; align-items: center; }
.health { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; font-size: 11px; }
.pill--ok { color: var(--good); }.pill--warn { color: var(--warn); }.pill--bad { color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.stat { padding: 11px 12px; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat b { display: block; font: 600 18px/1.2 var(--mono); }
.stat span { color: var(--muted); font-size: 11px; }
.rail { display: grid; gap: 8px; }
.rail__group { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.rail__head { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; background: var(--panel); font-size: 11px; }
.rail__head b, .rail__head span { font-family: var(--mono); }
.rail__head span { color: var(--muted); }
.rail__note { color: var(--muted); font-size: 11px; }
.attention { border-left: 3px solid var(--bad); background: var(--panel); padding: 8px 10px; }
.attention b { font-weight: 600; margin-right: 6px; }
.attention .act { margin-top: 3px; }
.attention .meta { margin-top: 2px; }
.groups { display: grid; gap: 12px; }
.group { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.group__head { padding: 9px 11px; background: var(--panel); display: flex; justify-content: space-between; gap: 8px; }
.group__head b { font-size: 12px; }.group__head span { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.rows { display: grid; }
/* The display title leads. The canonical selector keeps its own column —
   demoting an id is not hiding it. */
.row { appearance: none; width: 100%; border: 0; border-radius: 0; border-top: 1px solid var(--line); border-left: 4px solid transparent; padding: 10px 11px; text-align: left; display: grid; grid-template-columns: minmax(180px,1.6fr) minmax(120px,.85fr) minmax(76px,.5fr) minmax(150px,.9fr) minmax(90px,.55fr) minmax(80px,.5fr); gap: 10px; align-items: baseline; }
.row:first-child { border-top: 0; }
.row:hover:not(:disabled) { background: var(--panel); }
.id { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
.title { font-weight: 500; }.meta { color: var(--muted); font-size: 11px; }
.source { font-family: var(--mono); font-size: 10px; color: var(--muted); }
/* Chips, ages and clock times are the same across all five Apps. */
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid currentColor; border-radius: 999px; padding: 2px 7px; font: 500 10px/1.35 var(--sans); white-space: nowrap; color: var(--muted); vertical-align: middle; }
.chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
.chip--live, .chip--pass { color: var(--good); }.chip--warn { color: var(--warn); }.chip--block { color: var(--bad); }.chip--idle { color: var(--muted); }
.chip--attend { color: var(--state-attend); }.chip--running { color: var(--state-running); }.chip--stalled { color: var(--state-stalled); }.chip--landed { color: var(--state-landed); }.chip--dormant { color: var(--state-dormant); }
.semantic--attend { border-left-color: var(--state-attend); }.semantic--running { border-left-color: var(--state-running); }.semantic--stalled { border-left-color: var(--state-stalled); }.semantic--landed { border-left-color: var(--state-landed); }.semantic--dormant { border-left-color: var(--state-dormant); }
.age { font-family: var(--mono); }.age--quiet { color: var(--muted); }.age--amber { color: var(--state-stalled); }.age--loud { color: var(--state-attend); font-weight: 600; }
.cost { font-family: var(--mono); font-size: 11px; white-space: nowrap; }
/* The canonical selector is demoted, never hidden: it addresses every
   follow-up call, so it stays selectable even inside a row that is itself a
   button. */
.chip--id { font-family: var(--mono); -webkit-user-select: text; user-select: text; }
.chip--id::before { display: none; }
.empty, .error { border: 1px dashed var(--line); border-radius: 8px; padding: 18px; color: var(--muted); }
.error { color: var(--bad); border-color: currentColor; }
.drawer { border: 1px solid var(--line); border-radius: 9px; padding: 12px; display: grid; gap: 10px; }
.drawer[hidden] { display: none; }
.drawer__head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.drawer h2 { margin: 0; font: 600 15px/1.3 var(--mono); }
.kv { display: grid; grid-template-columns: 105px 1fr; gap: 5px 10px; margin: 0; }
.kv dt { color: var(--muted); }.kv dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }
.foot { color: var(--muted); font: 10px/1.4 var(--mono); display: flex; gap: 12px; flex-wrap: wrap; }
@media(max-width:620px) { .row { grid-template-columns: 1fr; gap: 3px; }.stat { border-top: 1px solid var(--line); border-left: 0; }.stats { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main id="app">
  <header class="top">
    <div><h1>Operations</h1><div class="sub" id="scope">Waiting for projection</div></div>
    <div class="controls"><button type="button" id="refresh">Refresh</button><button type="button" id="expand" hidden>Expand</button></div>
  </header>
  <p class="headline" id="headline"></p>
  <div class="health" id="health"></div>
  <section class="stats" id="stats"></section>
  <section class="rail" id="attention"></section>
  <section class="groups" id="groups"><div class="empty">Waiting for work.</div></section>
  <aside class="drawer" id="drawer" hidden></aside>
  <footer class="foot" id="foot"></footer>
</main>
<script>
(() => {
  "use strict";
  const PROTOCOL_VERSION = "2026-01-26";
  const APP_INFO = { name: "forged-operations-overview", version: "1.0.0" };
  const post = message => window.parent.postMessage(message, "*");
  const notify = (method, params = {}) => post({ jsonrpc: "2.0", method, params });
  let rpcId = 0;
  const pending = new Map();
  const timers = new Set();
  let observer = null;
  let sizeFrame = null;
  let tornDown = false;
  function request(method, params = {}) {
    if (tornDown) return Promise.reject(new Error("resource torn down"));

  }
  const host = { connected: false, capabilities: {}, context: {} };
  const state = { data: null, error: null, args: null, loading: false, detail: null, detailError: null, plan: null };
  const byId = id => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = String(text); return n; };
  const arr = value => Array.isArray(value) ? value : [];
  const num = value => typeof value === "number" && Number.isFinite(value) ? value : 0;
  const fmt = value => Math.round(num(value)).toLocaleString();
  const DECISION_CONDITIONS = ["input-required","merge-approval","quarantined","missing-cost","retry-exhausted","reviewer-disagreement","ambiguous-effect","restart-budget-exhausted","missing-evidence"];
  const SYMPTOM_CONDITIONS = ["blocked","beads-settlement-pending","revoking","controller-dead","failed-gate","provider-degraded","admission-deferred"];

  // Time and chips, one format across all five Apps. An operator reads an
  // AGE; a raw ISO stamp asks them to subtract it from now themselves.
  const stamp = ts => (ts ? Date.parse(ts) : NaN);
  function ms(value) { if (!Number.isFinite(value) || value < 0) return "—"; const s = Math.round(value / 1000); if (s < 60) return `${s}s`; const m = Math.floor(s / 60); if (m < 60) return `${m}m${String(s % 60).padStart(2, "0")}s`; return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}m`; }
  function clock(ts) { const t = stamp(ts); if (!Number.isFinite(t)) return "—"; const d = new Date(t); const pad = n => String(n).padStart(2, "0"); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
  function ago(ts) { const t = stamp(ts); if (!Number.isFinite(t)) return ""; const delta = Date.now() - t; if (delta < 0) return "just now"; return `${ms(delta)} ago`; }

  function chip(label, tone) { return el("span", `chip chip--${tone || "idle"}`, label); }
  // The label is the operator-facing repository name; the absolute path is
  // addressing, and belongs in the tool call rather than on the screen.
  function repositoryLabel(identity) { return identity?.repository?.label || identity?.repository?.path; }
  function conditionRows(value, all=[]) { const own=arr(value?.attention?.items??value?.attentionItems?.items??value?.attention);if(own.length)return own;const id=value?.subjectId||value?.id||value?.runId||value?.workRef?.id;return id?arr(all).filter(item=>(item?.subjectId||item?.id)===id):[]; }
  function semanticState(value, group, conditions=conditionRows(value)) { const queue=String(group||value?.queueGroup||value?.queue?.group||"").toLowerCase().replace(/\s+/g,"-");const outcome=value?.outcome||value?.execution?.outcome||value?.status?.outcome||value?.status?.terminalOutcome;const attempt=value?.attempt?.activity||value?.attempt?.state;const names=conditions.map(item=>typeof item==="string"?item:item?.condition).filter(Boolean);if(["needs-me","ready-to-merge"].includes(queue)||["clean","accepted-risk","input-required"].includes(outcome)||names.some(name=>DECISION_CONDITIONS.includes(name)))return "attend";if(queue==="running"||attempt==="running"||names.includes("revoking"))return "running";if(queue==="stalled-or-recoverable"||outcome==="blocked"||names.some(name=>name!=="revoking"&&SYMPTOM_CONDITIONS.includes(name)))return "stalled";if(outcome==="landed"||value?.merged===true||value?.execution?.merged===true||value?.status?.merged===true)return "landed";if(queue==="planned"||["cancelled","superseded"].includes(outcome)||value?.source==="live-plan"||value?.workRef?.kind==="plan")return "dormant";return "dormant"; }
  function semanticLabel(value, conditions, semantic=semanticState(value,null,conditions)) { return conditions.some(item=>(typeof item==="string"?item:item?.condition)==="revoking")?"recovering":semantic; }
  function semanticReason(conditions) { const item=conditions.find(row=>row?.condition==="revoking");return item?.evidence?.reason||item?.detail||""; }
  function spendText(spend) { if(!spend||(!Object.hasOwn(spend,"costUsdKnown")&&!Object.hasOwn(spend,"rowsMissingCost")))return null;const known=num(spend.costUsdKnown),missing=num(spend.rowsMissingCost);if(missing>0&&known===0)return "?";return `$${known.toFixed(2)}${missing>0?` + ${fmt(missing)} unpriced`:""}`; }
  function queueCount(data, code, label) { const group=arr(data?.queue?.groups).find(row=>row?.code===code||row?.label===label||row?.name===label);if(group)return num(group.total??group.count);const fallback=code==="running"?data?.counts?.live:code==="ready-to-merge"?data?.counts?.reviewReady:undefined;return typeof fallback==="number"?fallback:null; }
  function fullHeadline(data) { const hasAttention=Array.isArray(data?.attention),items=arr(data?.attention),total=typeof data?.attentionTotal==="number"?data.attentionTotal:typeof data?.counts?.attention==="number"?data.counts.attention:items.length;const decisions=items.filter(item=>DECISION_CONDITIONS.includes(item?.condition));const symptoms=new Map();for(const item of items)if(SYMPTOM_CONDITIONS.includes(item?.condition))symptoms.set(item.condition,(symptoms.get(item.condition)||0)+1);const oldest=decisions.map(item=>item?.openedAt).filter(Boolean).sort()[0];const parts=[];const degraded=degradedSources(data);if(degraded.length)parts.push(`Degraded sources: ${degraded.join(", ")}`);if(hasAttention)parts.push(`${fmt(decisions.length)} decision${decisions.length===1?"":"s"}${oldest?`, oldest ${age(oldest)}`:""}`);const running=queueCount(data,"running","Running");if(running!=null)parts.push(`${fmt(running)} running`);const ready=queueCount(data,"ready-to-merge","Ready to merge");if(ready!=null)parts.push(`${fmt(ready)} ready to merge`);const grouped=[...symptoms].sort(([a],[b])=>a.localeCompare(b)).map(([name,count])=>`${name.replace(/-/g," ")} ${fmt(count)}`).join(", ");if(hasAttention)parts.push(grouped?`symptoms: ${grouped}`:"0 symptoms");if(data?.spend){const known=num(data.spend.costUsdKnown),missing=num(data.spend.rowsMissingCost);parts.push(missing>0&&known===0?`? known spend (${fmt(missing)} unpriced)`:`$${known.toFixed(2)} known spend${missing?` + ${fmt(missing)} unpriced`:""}`);}if(hasAttention&&total>items.length)parts.push(`${fmt(items.length)} of ${fmt(total)} attention conditions classified (capped)`);return `${parts.join("; ")}.`; }

  function envelopeFrom(params) {
    let value = params?.structuredContent;
    if (!value) {
      const text = arr(params?.content).find(block => block.type === "text")?.text;
      try { value = JSON.parse(text); } catch { value = null; }
    }
    return value;
  }
  function ingest(params) {
    const envelope = envelopeFrom(params);
    if (envelope?.ok === false) { state.error = envelope.error || { message: "Operation failed" }; state.data = null; render(); return; }
    const data = envelope?.result ?? envelope;
    if (!data || data.schema !== "forged.operations-overview/1") {
      state.error = { message: "The host returned an unsupported Operations payload." }; state.data = null; render(); return;
    }
    state.error = null; state.data = data; render();
  }
  function healthPill(name, source) {
    const status = source?.state || "unknown";
    const cls = status === "available" ? "pill pill--ok" : status === "partial" ? "pill pill--warn" : "pill pill--bad";
    return el("span", cls, `${name} ${status}`);
  }
  function titleFor(entry) { return entry?.titleSource?.value || entry?.identity?.displayTitle || entry?.beadId || "Untitled work"; }
  // A resolved title states its authority: an id form is rendered AS an id,
  // and a current Beads read is marked live rather than read as launch
  // evidence. A payload without `titleSource` marks nothing.
  function titleMark(entry) { const t = entry?.titleSource; return !t ? "" : t.known === false ? "untitled id" : t.source === "beads.title" ? "live title" : ""; }
  function stateFor(detail) { return detail?.status?.state || detail?.status?.status || detail?.state || "unknown"; }
  const SEVERITY_RANK = { critical: 0, high: 1, medium: 2, low: 3 };
  // The rail is bounded so it stays a rail rather than a second queue. What
  // it did not draw is stated, never dropped.
  const RAIL_CAP = 12;
  function severityTone(severity) { return severity === "critical" || severity === "high" ? "block" : severity === "medium" ? "warn" : "idle"; }
  function attentionTitle(item) { return item?.subjectTitle?.value || item?.subjectId || item?.id || "unknown subject"; }
  function attentionSelector(item) { const id = item?.subjectId || item?.id; return id ? `${item?.subjectKind || "run"}:${id}` : null; }
  /**
   * One rail an operator can actually read.
   *
   * Conditions group, because "what kind of thing is stuck" is the first
   * question. Inside a group the OLDEST hold leads: the thing that has
   * waited longest is the thing that has been ignored longest. The subject's
   * own title names the row and the projection's recommended action is the
   * point of it — neither is re-derived here, because this App has no ledger
   * to re-derive them against.
   */
  function renderRail(data) {
    const rail = byId("attention");
    const items = arr(data.attention);
    const total = Math.max(num(data.attentionTotal ?? data.counts?.attention ?? items.length), items.length);
    const groups = new Map();
    for (const item of items) {
      const condition = String(item?.condition || "attention");
      if (!groups.has(condition)) groups.set(condition, []);
      groups.get(condition).push(item);
    }
    const opened = item => { const at = stamp(item?.openedAt); return Number.isFinite(at) ? at : Number.POSITIVE_INFINITY; };

      if (remaining <= 0) break;
      rows.sort((a, b) => opened(a) - opened(b));

      const head = el("div", "rail__head");

      head.append(el("span", "", shown.length < rows.length ? `${fmt(shown.length)} of ${fmt(rows.length)}` : fmt(rows.length)));
      group.append(head);
      for (const item of shown) {
        const row = el("div", "attention");
        const title = el("b", "", attentionTitle(item));

        // queue row: an id form is rendered AS an id.
        if (item?.subjectTitle?.known === false) { title.append(document.createTextNode(" ")); title.append(el("span", "source", "untitled id")); }
        row.append(title);
        const selector = attentionSelector(item);
        if (selector) row.append(chip(selector, "id"));
        if (item?.severity) row.append(chip(item.severity, severityTone(item.severity)));
        row.append(el("div", "act", item?.recommendedAction?.text || "The projection recommended no action."));
        row.append(el("div", "meta", `${item?.detail || ""}${item?.openedAt ? ` · opened ${age(item.openedAt)}` : ""}`));

  function renderDetail() {
    const box = byId("drawer"); box.replaceChildren();
    if (!state.detail && !state.detailError && !state.plan) { box.hidden = true; return; }

    const head = el("div", "drawer__head");

    heading.append(el("h2", "", state.plan ? titleFor(state.plan) : state.detail ? (state.detail.titleSource?.value || state.detail.identity?.displayTitle || state.detail.id) : "Detail unavailable"));
    if (state.plan) heading.append(chip(`${state.plan.kind || "plan"}:${state.plan.id}`, "id"));

    const dl = el("dl", "kv");
    const add = (key, value) => { dl.append(el("dt", "", key)); dl.append(el("dd", "", value == null ? "—" : value)); };
    if (state.plan) {
      const entry = state.plan;
      add("plan facts", "from the live Beads read; no execution record exists yet");
      add("bead", entry.beadId || entry.id);
      add("status", entry.plan?.status);
      add("readiness", entry.plan?.readiness);
      add("issue type", entry.plan?.issueType);
      add("priority", entry.plan?.priority ?? entry.priority);
      add("assignee", entry.plan?.assignee);
      add("parent", entry.plan?.parent);
      add("dependencies", arr(entry.plan?.dependencies).length);
      add("repository", repositoryLabel(entry.identity) || entry.repo);
      add("updated", age(entry.lastProgressAt || entry.updatedAt));
      add("next action", entry.nextAction);
      box.append(dl);
      return;
    }
    add("state", stateFor(state.detail));
    add("repository", repositoryLabel(state.detail.identity));
    add("workers", arr(state.detail.workers?.sessions).length);
    add("findings", num(state.detail.reviews?.latestFindingTotal ?? arr(state.detail.reviews?.latestFindings).length));
    add("known spend", spendText(state.detail.usage?.totals) || "—");
    box.append(dl);
  }
  /**
   * A live-plan row is not a dead row: its whole Beads record already
   * travelled inside the projection, so opening it needs no tool call.
   */
  function openPlan(entry) { state.detail = null; state.detailError = null; state.plan = entry; renderDetail(); reportSize(); }
  async function openDetail(entry) {
    if (!host.capabilities.serverTools || !entry?.detailTarget) return;
    state.detail = null; state.detailError = null; state.plan = null; renderDetail();
    try {
      const result = await request("tools/call", { name: "work_detail", arguments: { schemaVersion: 1, params: entry.detailTarget } });
      const envelope = envelopeFrom(result);
      if (envelope?.ok === false) throw new Error(envelope.error?.message || "Detail failed");
