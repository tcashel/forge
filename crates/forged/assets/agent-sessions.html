<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forged Agent Sessions</title>
<style>
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, light-dark(#fbfbfa,#141519));
  --panel: var(--color-background-secondary, light-dark(#f4f4f1,#1b1d22));
  --ink: var(--color-text-primary, light-dark(#17191e,#eceef1));
  --muted: var(--color-text-secondary, light-dark(#626773,#a3a8b2));
  --line: var(--color-border-primary, light-dark(#deddd7,#30333a));
  --good: var(--color-text-success, light-dark(#287a43,#6bc27e));
  --warn: var(--color-text-warning, light-dark(#8b6313,#ddb04d));
  --bad: var(--color-text-danger, light-dark(#b43c31,#e87b70));
  --accent: light-dark(#167b72,#42c9b7);
  --state-attend: light-dark(#a62f48,#ff879a);
  --state-running: light-dark(#176f9f,#66c7f2);
  --state-stalled: light-dark(#93610b,#e8b34f);
  --state-landed: light-dark(#287a43,#76cf8b);
  --state-dormant: light-dark(#6d6875,#aaa4b2);
  --sans: ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono: ui-monospace,SFMono-Regular,Menlo,monospace;
}
* { box-sizing: border-box; min-width: 0; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); }
button { font: inherit; color: inherit; cursor: pointer; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
button:hover:not(:disabled) { background: var(--panel); }
button:disabled { opacity: .55; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { padding: 16px; display: grid; gap: 14px; }
.top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
h1 { margin: 0; font: 600 20px/1.2 var(--sans); letter-spacing: -.02em; }
.sub,.muted { color: var(--muted); }.sub { margin-top: 4px; font: 11px/1.4 var(--mono); }
.headline { margin:0; overflow:hidden; font-weight:500; text-overflow:ellipsis; white-space:nowrap; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; }
.capability { border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit,minmax(110px,1fr)); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.stat { padding: 10px 12px; border-left: 1px solid var(--line); }.stat:first-child { border-left: 0; }
.stat b { display: block; font: 600 17px/1.2 var(--mono); }.stat span { color: var(--muted); font-size: 11px; }
.coverage { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; font: 10px/1.3 var(--mono); }
.sessions { display: grid; gap: 10px; }
.session-row { border: 1px solid var(--line); border-left:4px solid transparent; border-radius: 9px; overflow: hidden; }
.session-head { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; padding: 10px 11px; background: var(--panel); }
.session-title { font-weight: 600; overflow-wrap: anywhere; }.selector { color: var(--muted); font: 10px/1.4 var(--mono); overflow-wrap: anywhere; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
/* Chips, ages and clock times are the same across all five Apps. */
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid currentColor; border-radius: 999px; padding: 2px 7px; font: 500 10px/1.35 var(--sans); white-space: nowrap; color: var(--muted); vertical-align: middle; }
.chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
.chip--good,.chip--live,.chip--pass { color: var(--good); }.chip--warn { color: var(--warn); }.chip--bad,.chip--block { color: var(--bad); }.chip--idle { color: var(--muted); }
.chip--attend { color:var(--state-attend); }.chip--running { color:var(--state-running); }.chip--stalled { color:var(--state-stalled); }.chip--landed { color:var(--state-landed); }.chip--dormant { color:var(--state-dormant); }
.semantic--attend { border-left-color:var(--state-attend); }.semantic--running { border-left-color:var(--state-running); }.semantic--stalled { border-left-color:var(--state-stalled); }.semantic--landed { border-left-color:var(--state-landed); }.semantic--dormant { border-left-color:var(--state-dormant); }
.age--quiet { color:var(--muted); }.age--amber { color:var(--state-stalled); }.age--loud { color:var(--state-attend); }
/* The canonical selector is demoted, never hidden: it addresses every
   follow-up call, so it stays selectable. */
.chip--id { font-family: var(--mono); -webkit-user-select: text; user-select: text; }
.chip--id::before { display: none; }
.facts { display: grid; grid-template-columns: repeat(auto-fit,minmax(235px,1fr)); gap: 0; }
.panel { padding: 10px 11px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }.panel:nth-child(3n+1) { border-left: 0; }
.panel--lead { border-left: 0; }
.more { border-top: 1px solid var(--line); }
.more > summary { padding: 8px 11px; cursor: pointer; color: var(--muted); font-size: 11px; }
.more > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.panel h2 { margin: 0 0 7px; font-size: 11px; }
.kv { display: grid; grid-template-columns: 115px 1fr; gap: 4px 8px; margin: 0; }.kv dt { color: var(--muted); }.kv dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }
.session-action { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 9px 11px; border-top: 1px solid var(--line); }
.guidance { color: var(--muted); font-size: 11px; }.guidance b { color: var(--ink); font-family: var(--mono); }
.empty,.error { border: 1px dashed var(--line); border-radius: 8px; padding: 18px; color: var(--muted); }.error { color: var(--bad); border-color: currentColor; }
.drawer { border: 1px solid var(--line); border-radius: 9px; padding: 12px; display: grid; gap: 9px; }.drawer[hidden] { display: none; }
.drawer-head { display: flex; justify-content: space-between; gap: 10px; }.drawer h2 { margin: 0; font: 600 15px/1.3 var(--mono); }
.foot { color: var(--muted); font: 10px/1.4 var(--mono); display: flex; gap: 12px; flex-wrap: wrap; }
@media(max-width:720px) { .panel { border-left: 0; }.stats { grid-template-columns: 1fr 1fr; }.stat { border-top: 1px solid var(--line); border-left: 0; }.session-head,.session-action { flex-direction: column; }.chips { justify-content: flex-start; } }
</style>
</head>
<body>
<main id="app">
  <header class="top">
    <div><h1>Agent Sessions</h1><div class="sub" id="scope">Waiting for provider-attempt inventory</div></div>
    <div class="controls"><button type="button" id="refresh">Refresh</button><button type="button" id="history">Show history</button><button type="button" id="next">Next page</button><button type="button" id="expand" hidden>Expand</button></div>
  </header>
  <p class="headline" id="headline"></p>
  <div class="capability" id="capability">Connecting to the MCP Apps host.</div>
  <section class="stats" id="stats"></section>
  <section class="coverage" id="coverage"></section>
  <section class="sessions" id="sessions"><div class="empty">Waiting for sessions.</div></section>
  <aside class="drawer" id="drawer" hidden></aside>
  <footer class="foot" id="foot"></footer>
</main>

  // The handshake advertises fullscreen, so the surface has to offer the
