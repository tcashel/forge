[workspace]
resolver = "2"
members = [
    "crates/forged-types",
    "crates/forged-ledger",
    "crates/forged-host",
    "crates/forged-git",
    "crates/forged-gate",
    "crates/forged-beads",
    "crates/forged-provider",
    "crates/forged-proto",
    "crates/forged",
]

[workspace.package]
version = "0.6.2"
edition = "2021"
rust-version = "1.97"
license-file = "LICENSE"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
jiff = "0.2"
minijinja = "2"
nix = { version = "0.31", features = ["fs", "process", "signal"] }
proptest = "1"
rmcp = { version = "3.1", features = ["server", "transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { version = "1", features = ["v7", "v5"] }
