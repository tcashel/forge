name: release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      # The Beads pins this workflow fails closed on live in the composite
      # action, so a change there must still trigger the PR preflight.
      - .github/actions/provision-beads/action.yml
      - Cargo.lock
      - Cargo.toml
      - CHANGELOG.md
      - LICENSE
      - .agents/**
      - .claude-plugin/**
      - install.sh
      - package.json
      - plugins/forged/**
      - crates/*/Cargo.toml
      - rust-toolchain.toml
      - scripts/package-release.sh
      - scripts/test-install.sh
      - scripts/validate-plugin.sh
      - uninstall.sh
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  # Only PR runs on the same ref are disposable; a tag is pushed once and its
  # release/package/test jobs must run to completion rather than be cancelled
  # by a later event landing on the same group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This env block must stay identical to rust.yml's: rust-cache hashes
# CARGO*/RUST* env values into its cache key, and the test and failpoints
# jobs here restore the caches rust.yml saves from main (matched by job id).
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Runs on every PR that touches release-relevant paths, and first on a tag
  # push. Cheap: no full workspace build, no package matrix. Everything here
  # must stay fast enough to run on every PR.
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-save-if: 'false'

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$({
            sed -n '/^\[workspace\.package\]$/,/^\[/ {
              s/^version = "\([^"]*\)"$/\1/p
            }' Cargo.toml
          } | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid workspace release version: $version" >&2
            exit 1
          fi
          if ! grep -Eq "^## \\[$version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated $version release section" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Validate shared plugin and version parity
        run: bash scripts/validate-plugin.sh

      - uses: ./.github/actions/provision-beads
        id: release_beads

      - name: Probe pinned Beads capabilities
        # v0.5.0 carries a temporary, explicit compatibility exception for the
        # v1.2.1 artifact. Publication still fails closed unless that exact
        # binary passes every required command and genuine lease/doctor probe.
        env:
          FORGED_TEST_BD: ${{ steps.release_beads.outputs.path }}
          FORGED_REQUIRE_BD: '1'
        shell: bash
        run: |
          set -euo pipefail
          for capability in heartbeat reclaim merge-slot epic; do
            "$FORGED_TEST_BD" "$capability" --help >/dev/null
          done
          cargo test -p forged-beads --test audit_doctor \
            doctor_with_the_sandboxed_bd_probes_green -- --nocapture

      - name: Assert tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/tags/v$VERSION" ]]; then
            echo "tag ref $GITHUB_REF does not match workspace version v$VERSION" >&2
            exit 1
          fi

  # Full workspace test suite. Tag-only: PRs get the fast doctor probe above,
  # not a second uncached run of the whole suite CI already covers.
  test:
    # A custom `if` on a job with `needs` replaces the implicit success
    # check, not layers on it — `success()` must be explicit or a failed
    # preflight would not stop this job from starting on a tag push.
    if: success() && startsWith(github.ref, 'refs/tags/')
    needs: preflight
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-save-if: 'false'

      - uses: ./.github/actions/provision-beads
        with:
          export-gated-test-env: 'true'

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-nextest@0.9.143

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo nextest run --workspace

      - name: Verify binary version
        run: test "$(target/debug/forged --version)" = "forged $VERSION"

  # Failpoint matrix runs in its own job so it doesn't serialize behind the
  # full workspace test job above.
  failpoints:
    if: success() && startsWith(github.ref, 'refs/tags/')
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-save-if: 'false'

      - uses: ./.github/actions/provision-beads
        with:
          export-gated-test-env: 'true'

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-nextest@0.9.143

      - name: Failpoint matrix
        run: cargo nextest run -p forged --features failpoints

  # Darwin assurance: forged runs on operator Macs and its reclaim saga is
  # process-group signaling, where darwin semantics diverge from Linux. The
  # pinned Beads binary is linux-amd64 only, so these jobs provision no bd:
  # the bd-gated cases SKIP loudly here and bd-contract coverage stays on the
  # Linux jobs above. Standard macOS runners bill nothing on a public repo.
  test-macos:
    if: success() && startsWith(github.ref, 'refs/tags/')
    needs: preflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-save-if: 'false'

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-nextest@0.9.143

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo nextest run --workspace

  failpoints-macos:
    if: success() && startsWith(github.ref, 'refs/tags/')
    needs: preflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-save-if: 'false'

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-nextest@0.9.143

      - name: Failpoint matrix
        run: cargo nextest run -p forged --features failpoints

  package:
    if: success() && startsWith(github.ref, 'refs/tags/')
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            smoke: true
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            smoke: true
          - runner: macos-15
            target: aarch64-apple-darwin
            smoke: true
            service_smoke: true
          - runner: macos-15
            target: x86_64-apple-darwin
            smoke: false # cross-compiled; Intel Macs get no test legs (operator decision)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add "$TARGET"

      - name: Build native release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p forged --target "$TARGET"

      - name: Package release bundle
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/package-release.sh "$TARGET" dist

      - name: Create local checksum
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          asset="forge-$TARGET.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > SHA256SUMS
          else
            shasum -a 256 "$asset" > SHA256SUMS
          fi

      - name: Smoke install and uninstall
        if: matrix.smoke
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: bash scripts/test-install.sh "dist/forge-$TARGET.tar.gz" "$VERSION" "$TARGET"

      - name: Smoke isolated managed service
        if: matrix.service_smoke
        env:
          BD_BIN: /usr/bin/true
          FORGED_SERVICE_SMOKE_TEST: '1'
          TARGET: ${{ matrix.target }}
        # --target must match the release build above: omitting it makes
        # cargo rebuild the whole workspace for the host triple into a
        # second, uncached build tree.
        run: cargo test --release -p forged --target "$TARGET" --test service_macos_smoke -- --ignored --nocapture

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: dist/forge-${{ matrix.target }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  release:
    if: success() && startsWith(github.ref, 'refs/tags/')
    needs: [preflight, test, failpoints, test-macos, failpoints-macos, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse an unsafe release ref
        # GITHUB_REF is the pushed tag by construction; the only remaining
        # invariants worth a real check are that the tagged commit is on
        # main, and that the version is a genuine forward step.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag commit $GITHUB_SHA is not reachable from origin/main" >&2
            exit 1
          fi
          latest_tag="$(gh release view \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq .tagName)"
          latest_version="${latest_tag#v}"
          if [[ "$(printf '%s\n' "$latest_version" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" \
            || "$latest_version" == "$VERSION" ]]; then
            echo "$VERSION must be newer than current release $latest_version" >&2
            exit 1
          fi
          gh api --silent rate_limit >/dev/null

      - name: Create draft release from changelog
        uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        with:
          changelog: CHANGELOG.md
          title: Forge $tag
          draft: true
          branch: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          expected_archives=(
            forge-aarch64-apple-darwin.tar.gz
            forge-aarch64-unknown-linux-gnu.tar.gz
            forge-x86_64-apple-darwin.tar.gz
            forge-x86_64-unknown-linux-gnu.tar.gz
          )
          printf '%s\n' "${expected_archives[@]}" | sort > expected-archives.txt
          find dist -maxdepth 1 -type f -name 'forge-*.tar.gz' -exec basename {} \; \
            | sort > actual-archives.txt
          diff -u expected-archives.txt actual-archives.txt

          install -m 0755 install.sh dist/install.sh
          install -m 0755 uninstall.sh dist/uninstall.sh
          (
            cd dist
            sha256sum \
              "${expected_archives[@]}" \
              install.sh \
              uninstall.sh > SHA256SUMS
          )

      - name: Upload and verify draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY"

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > draft-release.json
          # targetCommitish is the default branch when a release is created on
          # an existing tag; the ls-remote check below binds the exact SHA.
          jq -e \
            --arg tag "$TAG" \
            '.tagName == $tag and .isDraft and (.isPrerelease | not)' \
            draft-release.json >/dev/null
          printf '%s\n' \
            SHA256SUMS \
            forge-aarch64-apple-darwin.tar.gz \
            forge-aarch64-unknown-linux-gnu.tar.gz \
            forge-x86_64-apple-darwin.tar.gz \
            forge-x86_64-unknown-linux-gnu.tar.gz \
            install.sh \
            uninstall.sh | sort > expected-assets.txt
          jq -r '.assets[].name' draft-release.json | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          jq -e 'all(.assets[]; .size > 0)' draft-release.json >/dev/null
          mkdir verified-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir verified-assets
          (cd verified-assets && sha256sum -c SHA256SUMS)
          draft_tag_sha="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [[ -n "$draft_tag_sha" && "$draft_tag_sha" != "$GITHUB_SHA" ]]; then
            echo "draft tag points to $draft_tag_sha, expected $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Publish and verify exact release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,isImmutable,assets > published-release.json
          jq -e \
            --arg tag "$TAG" \
            '.tagName == $tag and (.isDraft | not) and (.isPrerelease | not) and .isImmutable' \
            published-release.json >/dev/null
          jq -r '.assets[].name' published-release.json | sort > published-assets.txt
          diff -u expected-assets.txt published-assets.txt
          remote_sha="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "published tag points to $remote_sha, expected $GITHUB_SHA" >&2
            exit 1
          fi
