name: rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads rust-toolchain.toml for the toolchain version; caches by default.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: provision pinned bd 1.2.1
        id: stable_bd
        run: |
          bash scripts/ci/provision-bd.sh \
            https://github.com/gastownhall/beads/releases/download/v1.2.1/beads_1.2.1_linux_amd64.tar.gz \
            48aecf42ffdefa6470298d8022deeb762e30c8729dc0a4bdda93888c0b0354e2 \
            "$RUNNER_TEMP/forged-bd-1.2.1" \
            1.2.1

      - name: require pinned bd 1.2.1
        run: |
          echo "FORGED_TEST_BD=${{ steps.stable_bd.outputs.path }}" >> "$GITHUB_ENV"
          echo "FORGED_REQUIRE_BD=1" >> "$GITHUB_ENV"
          echo "FORGED_EXPECT_BD_VERSION=1.2.1" >> "$GITHUB_ENV"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace --locked

      - name: test
        run: cargo test --workspace

      # The genuine-expiry variant stays #[ignore]d and is run deliberately
      # with FORGED_SLOW_TESTS=1 rather than on every pull request.
      - name: failpoints
        run: cargo test -p forged --features failpoints

      - name: stable real-bd qualification
        run: |
          cargo test -p forged-beads -- --nocapture
          cargo test -p forged --features failpoints \
            real_bd_lease_cycle_against_a_temp_beads_dir -- --exact --nocapture
