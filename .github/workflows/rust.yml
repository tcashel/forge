name: rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch/ref at a time; only PR runs get cancelled by a newer
# push (a push-to-main run is left to finish undisturbed).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Trims test-binary debuginfo to line tables only, to cut CI compile time.
# This env block must stay identical to release.yml's: rust-cache hashes
# CARGO*/RUST* env values into its cache key, and release.yml's test and
# failpoints jobs restore the caches saved here (matched by job id).
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # The contract this workflow keeps, in three clauses:
  #
  #   1. Every pull request produces a `ci-ok` verdict. `ci-ok` is the one
  #      required check in the branch ruleset, so a run that never reports it
  #      leaves the PR permanently unmergeable. That is why the cargo gates are
  #      skipped by an `if:` on live jobs and never by `paths-ignore` on the
  #      workflow, and why `ci-ok` runs with `if: always()`.
  #   2. A documentation-only diff skips those cargo gates, and `ci-ok` still
  #      reports success. Docs-only means every changed path is `**/*.md` or
  #      lives under `docs/`; everything else is code, deliberately including
  #      the workflow files themselves, Cargo.*, scripts, LICENSE and dotfiles.
  #   3. The classification fails closed. Anything this job cannot settle with
  #      certainty — an unknown event, an unreachable base commit, an empty
  #      diff, any git error — is reported as code and the full suite runs.
  #
  # Hand-rolled rather than dorny/paths-filter: the classification is a dozen
  # lines of shell that can be exercised locally, where the action would add a
  # third-party `uses:` and want a token to reach the API — and this repo pins
  # every action by full SHA and runs zizmor offline precisely to keep that
  # surface small. Checkout is unshallow so the base commit is in history.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          # Every abnormal exit lands here: report code and let the gates run.
          fail_closed() {
            echo "changes: $1 -- classifying as code" >&2
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              # HEAD is the PR merge commit, so `base...HEAD` is exactly the
              # commits the PR contributes and nothing the base branch moved.
              base="$PR_BASE_SHA"
              range=("$base...HEAD")
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              # An empty or all-zero before-SHA is a new branch or first push:
              # there is no predecessor to diff against.
              case "$base" in
                *[!0]*) ;;
                *) fail_closed "push reports no predecessor commit" ;;
              esac
              range=("$base" 'HEAD')
              ;;
            *)
              fail_closed "unhandled event '$EVENT_NAME'"
              ;;
          esac

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
            git cat-file -e "$base^{commit}" 2>/dev/null \
              || fail_closed "base commit $base is not reachable"
          fi

          # `--no-renames` so a rename is reported as both paths. With rename
          # detection on, moving `crates/**/main.rs` to `docs/main.md` reports
          # only the destination and would read as docs-only, skipping the
          # gates on a change that deleted a source file.
          list="$RUNNER_TEMP/changed-paths"
          git diff --name-only -z --no-renames "${range[@]}" -- > "$list" \
            || fail_closed "git diff against $base failed"
          [ -s "$list" ] || fail_closed "diff against $base is empty"

          code=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/*|*.md) continue ;;
              *) code=true; break ;;
            esac
          done < "$list"

          echo 'changed paths:'
          tr '\0' '\n' < "$list"
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    # `success()` is not implied once a custom `if` is present (see `changes`).
    if: success() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads rust-toolchain.toml for the toolchain version; caches by default.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt, clippy
          # Only persist the cache from main; PR branches restore it read-only
          # so near-duplicate multi-GB caches don't pile up in the pool.
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: changes
    # `success()` is not implied once a custom `if` is present (see `changes`).
    if: success() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Job-level, never workflow-level: the workflow env block above must stay
    # byte-identical to release.yml's or rust-cache's key diverges. NEXTEST_* is
    # not among the CARGO*/RUST* prefixes rust-cache hashes, so the caches these
    # jobs save and release.yml restores are unaffected.
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads rust-toolchain.toml for the toolchain version; caches by default.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # Only persist the cache from main; PR branches restore it read-only
          # so near-duplicate multi-GB caches don't pile up in the pool.
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest@0.9.143

      - name: runner facts
        run: nproc; free -g | sed -n 2p

      - name: build
        run: cargo build --workspace --locked

      - name: test
        run: cargo nextest run --workspace

      # Uploads on failure too — a red run is exactly when the per-test detail
      # is worth having. Observational only: nothing here gates ci-ok.
      - name: upload test results
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          flags: workspace

  failpoints:
    needs: changes
    # `success()` is not implied once a custom `if` is present (see `changes`).
    if: success() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads rust-toolchain.toml for the toolchain version; caches by default.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # Only persist the cache from main; PR branches restore it read-only
          # so near-duplicate multi-GB caches don't pile up in the pool.
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest@0.9.143

      # The failpoint kill-matrix. Lease semantics are ledger-native
      # (ADR-0034): no bd binary is involved here.
      - name: runner facts
        run: nproc; free -g | sed -n 2p

      # Only the binaries that carry `cfg(feature = "failpoints")` tests run
      # here; every other forged test already ran unchanged in `test`. The
      # guard below fails the leg if a gated test appears in a binary this
      # list does not name, so the filter can never silently skip one.
      - name: failpoint binaries are all listed
        shell: bash
        run: |
          set -euo pipefail
          listed='forged herdr_orphan_failpoint ore_loop_failpoint kill_matrix run_status_failpoint work_identity_failpoint work_settlement_failpoint convergence supervise e2e_drive mcp_lazy_init review_publish'
          missing=0
          for file in $(grep -l 'cfg(feature = "failpoints")' crates/forged/tests/*.rs); do
            bin="$(basename "$file" .rs)"
            case " $listed " in
              *" $bin "*) ;;
              *) echo "test binary '$bin' has failpoint-gated tests but is not in the failpoints leg filter" >&2; missing=1 ;;
            esac
          done
          exit "$missing"

      - name: failpoints
        run: >-
          cargo nextest run -p forged --features failpoints
          -E 'binary(=forged) | binary(/_failpoint$/) | binary(=kill_matrix) | binary(=convergence)
          | binary(=supervise) | binary(=e2e_drive) | binary(=mcp_lazy_init) | binary(=review_publish)'

      # Distinct flag: this run is the same crate under a different feature set,
      # so Codecov must not fold it into the workspace suite.
      - name: upload test results
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          flags: failpoints

  # Line coverage for the default feature set, reported to Codecov but not
  # gated on. This measures the workspace as it ships. The failpoint kill-matrix is
  # cfg'd out here — `failpoints` is off by default, so that code is not
  # compiled into this build and is neither covered nor counted against it.
  # Runs once per merge to main, never on pull requests: coverage informs, it
  # does not gate (it is not part of ci-ok), and an instrumented run of the
  # whole workspace is fifteen runner-minutes a PR would otherwise spend on a
  # number nothing acts on. The Codecov PR comment is the accepted cost; the
  # post-merge upload still moves the main-branch baseline. Change-gated like
  # the others, so a docs push does not burn the run either.
  coverage:
    needs: changes
    # `success()` is not implied once a custom `if` is present (see `changes`).
    if: >-
      success() && needs.changes.outputs.code == 'true'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads rust-toolchain.toml for the toolchain version; caches by default.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # cargo-llvm-cov needs llvm-profdata/llvm-cov from the toolchain.
          components: llvm-tools
          # Only persist the cache from main; PR branches restore it read-only
          # so near-duplicate multi-GB caches don't pile up in the pool.
          cache-save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-llvm-cov@0.9.0,cargo-nextest@0.9.143

      - name: runner facts
        run: nproc; free -g | sed -n 2p

      - name: coverage
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info

      - name: upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

  # Exists so branch protection can require one stable check name.
  # On a documentation-only change the cargo gates skip and this job still
  # reports success, so the required check is answered on every run.
  ci-ok:
    needs: [changes, lint, test, failpoints]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Spelled out rather than written as a contains() expression: this is the
      # one thing branch protection trusts, so it must be readable as a whole.
      # It fails closed in both directions — an unclassified run, a docs-only
      # run where a gate did anything other than skip, or a code run where a
      # gate did anything other than succeed, all fail here.
      - name: require all gates green
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          FAILPOINTS: ${{ needs.failpoints.result }}
        run: |
          set -uo pipefail
          echo "changes=${CHANGES:-} code=${CODE:-} lint=${LINT:-}" \
               "test=${TEST:-} failpoints=${FAILPOINTS:-}"

          if [ "${CHANGES:-}" != 'success' ]; then
            echo "change detection reported '${CHANGES:-}'; nothing to certify" >&2
            exit 1
          fi

          case "${CODE:-}" in
            false)
              # Docs-only. The gates must have skipped; anything else — a
              # success included — means the graph did not do what this file
              # says, and the verdict cannot be trusted.
              for result in "${LINT:-}" "${TEST:-}" "${FAILPOINTS:-}"; do
                if [ "$result" != 'skipped' ]; then
                  echo "docs-only run, but a gate reported '$result'" >&2
                  exit 1
                fi
              done
              echo 'documentation-only change: cargo gates skipped'
              ;;
            true)
              for result in "${LINT:-}" "${TEST:-}" "${FAILPOINTS:-}"; do
                if [ "$result" != 'success' ]; then
                  echo "a required gate reported '$result'" >&2
                  exit 1
                fi
              done
              echo 'all gates green'
              ;;
            *)
              echo "change detection produced no usable verdict ('${CODE:-}')" >&2
              exit 1
              ;;
          esac
