# Dependabot configuration.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Rust dependencies (Cargo.toml + Cargo.lock, workspace-wide)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # No `labels:` block — Dependabot auto-applies its default `dependencies`
    # label; custom labels that don't exist in the repo are silently ignored.
    commit-message:
      prefix: "chore"
      include: "scope"
    # Batch low-risk bumps into one PR; majors still open individually so they
    # get a closer look.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
