# Serialization contract for the `supervise` integration tests. Those cases
# create, SIGSTOP, and SIGCONT real detached process groups and assert
# production deadline bounds against the wall clock, so they must never
# co-schedule with each other. This group replaces the in-binary Mutex they
# used to take: nextest runs every test in its own process, where a
# process-local lock serializes nothing. Under any runner that does not read
# this file, those cases skip loudly (see require_serialized_runner in
# crates/forged/tests/support/supervise.rs, used by both `supervise` and
# `supervise_failpoint`).

# nextest is this workspace's test runner; the floor matches the version CI
# pins. Below it, nextest refuses to run (exit 92) rather than half-honoring
# the contract above.
nextest-version = { required = "0.9.143" }

[profile.default]
# GitHub's Linux runner has 4 vCPUs. Reserving one leaves three nextest slots
# while keeping a CPU available to the controller/provider trees spawned by
# process-fixture tests.
test-threads = -1

[test-groups]
supervise-process-fixtures = { max-threads = 1 }
# Loop-mode epics execute through real supervisor ticks and detached child
# controllers, so the epic-driving binaries spawn process trees per test.
# On the 4-vCPU runner, `test-threads = -1` gives nextest three slots while
# this group may use two. The worst case is two epic trees plus one supervise
# tree, with the reserved CPU for spawned work but no in-process slack.
epic-process-fixtures = { max-threads = 2 }
# `coverage` and `relevance` drive the forged CLI as a subprocess per case
# (no daemon, no controller tree), so they get their own throttle: they
# neither take an epic slot nor fan out beside the process-tree groups.
cli-subprocess-fixtures = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(=forged) & (binary(=supervise) | binary(=supervise_failpoint))'
test-group = 'supervise-process-fixtures'

[[profile.default.overrides]]
filter = 'package(=forged) & (binary(=e2e_drive) | binary(=e2e_drive_failpoint) | binary(=convergence) | binary(=convergence_failpoint) | binary(=kill_matrix) | binary(=ore_loop) | binary(=ore_loop_failpoint))'
test-group = 'epic-process-fixtures'

[[profile.default.overrides]]
filter = 'package(=forged) & (binary(=coverage) | binary(=relevance))'
test-group = 'cli-subprocess-fixtures'

# JUnit XML for the Codecov test-results upload, written to
# `target/nextest/ci/junit.xml`. CI selects this profile with NEXTEST_PROFILE=ci
# so the gate commands stay byte-identical to the ones in CLAUDE.md.
#
# This profile deliberately declares no `overrides` of its own: nextest falls
# back to `profile.default.overrides` for any setting a named profile does not
# configure, so the serialization contract above still binds under `ci`.
# Adding `[[profile.ci.overrides]]` here would shadow it for matched tests.
[profile.ci.junit]
path = "junit.xml"
